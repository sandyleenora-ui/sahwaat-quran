  $("#drillCount").textContent = "السؤال "+ar(Q.i+1)+" من "+ar(Q.q.length);
  $("#drillNext").textContent = "تخطّي";
  const b = $("#drillBody");
  if(Q.mode==="count"){
    const n=c.v.length;
    const opts = shuffle([...new Set([n, Math.max(2,n-1), n+1, n+2>5?n-2:n+2])].slice(0,4));
    b.innerHTML = '<div class="q"><div class="q-ask">الآية دي بتتكرر كام مرة في المصحف كله؟</div>'
      + '<div class="verse pin"><div class="ayah">'+ayahHTML(c.v[0])+"</div></div>"
      + '<div class="opts">'+opts.map(o=>'<button class="opt" type="button" data-ans="'+o+'">'
          + '<span class="on">'+times(o)+"</span></button>").join("")
      + '</div><div id="fb"></div></div>';
    b.dataset.correct = n;
  } else if(Q.mode==="blank"){
    const ws = Object.keys(c.f.fill);
    const pickW = ws[(Math.random()*ws.length)|0];
    const occ = c.f.fill[pickW][0];
    b.innerHTML = '<div class="q"><div class="q-ask">الكلمة الناقصة في <b>'+esc(refAr(occ[0]))
      + "</b> إيه؟</div>"
      + '<div class="verse pin"><div class="ayah">'+frameLine(c)+"</div></div>"
      + '<div class="opts">'+shuffle(ws.slice()).map(w=>{
          const o=c.f.fill[w][0];
          return '<button class="opt" type="button" data-ans="'+esc(w)+'"><span class="ow">'
            + esc(D.verses[o[0]][0][o[1]+c.f.j])+"</span></button>";
        }).join("")+'</div><div id="fb"></div></div>';
    b.dataset.correct = pickW;
  } else if(Q.mode==="where"){
    const ws = Object.keys(c.f.fill);
    const pickW = ws[(Math.random()*ws.length)|0];
    const occ = c.f.fill[pickW][0];
    b.innerHTML = '<div class="q"><div class="q-ask">العبارة دي بالكلمة المُلوَّنة — فين موضعها؟</div>'
      + '<div class="verse pin"><div class="ayah">'+frameLine(c,pickW)+"</div></div>"
      + '<div class="opts">'+shuffle(ws.slice()).map(w=>
          '<button class="opt" type="button" data-ans="'+esc(w)+'"><span class="on">'
          + esc(c.f.fill[w].map(o=>refAr(o[0])).join(" • "))
          + '</span><span class="osub">الجزء '+ar(juzOf(c.f.fill[w][0][0]))+" • "
          + revAr(+c.f.fill[w][0][0].split(":")[0])+"</span></button>").join("")
      + '</div><div id="fb"></div></div>';
    b.dataset.correct = pickW;
  } else if(Q.mode==="fill"){
    const k=c.v[0], w=D.verses[k][0], sn=+k.split(":")[0];
    const show=Math.min(3, Math.max(1, Math.floor(w.length/3)));
    b.innerHTML = '<div class="q"><div class="q-ask">كمّلي الآية من حفظك، وبعدين اكشفي الإجابة.</div>'
      + '<div class="verse pin"><div class="ref">'+esc(refAr(k))
      + '<span class="juz">الجزء '+ar(juzOf(k))+"</span>"
      + '<span class="rev '+(ST[sn]==="makki"?"makki":"madani")+'">'+revAr(sn)+"</span></div>"
      + '<div class="ayah">'+esc(w.slice(0,show).join(" "))+' <span class="blank"></span></div></div>'
      + '<button class="btn block" type="button" id="reveal">إظهار الإجابة</button>'
      + '<div id="fb"></div></div>';
  } else if(Q.mode==="nextayah"){
    const k=c.v[0], n=+k.split(":")[0], a=+k.split(":")[1], last=a===SC[n];
    b.innerHTML = '<div class="q"><div class="q-ask">إيه الآية اللي بعد دي على طول؟</div>'
      + '<div class="verse pin"><div class="ref">'+esc(refAr(k))
      + '<span class="juz">الجزء '+ar(juzOf(k))+"</span></div>"
      + '<div class="ayah">'+ayahHTML(k)+"</div></div>"
      + (last ? '<div class="hint"><div>خلّي بالك: دي <b>آخر آية في '+esc(SU[n])
                + "</b>، فاللي بعدها في سورة تانية.</div></div>" : "")
      + '<button class="btn block" type="button" id="reveal">إظهار الإجابة</button>'
      + '<div id="fb"></div></div>';
  } else if(Q.mode==="blankfree"){
    const ws=Object.keys(c.f.fill), pickW=ws[(Math.random()*ws.length)|0];
    const occ=c.f.fill[pickW][0];
    b.innerHTML = '<div class="q"><div class="q-ask">إيه الكلمة الناقصة في <b>'+esc(refAr(occ[0]))
      + "</b>؟ فكّري من غير اختيارات، وبعدين اكشفي.</div>"
      + '<div class="verse pin"><div class="ayah">'+frameLine(c)+"</div></div>"
      + '<button class="btn block" type="button" id="reveal">إظهار الإجابة</button>'
      + '<div id="fb"></div></div>';
  } else { /* spot the difference */
    const cands=[];
    for(let x=0;x<c.v.length;x++) for(let y=x+1;y<c.v.length;y++) cands.push([c.v[x],c.v[y]]);
    let pair=null, B=null;
    for(const p of shuffle(cands)){
      const d = diffIdx(toks(p[0]), toks(p[1]))[1];
      if(d.size){ pair=p; B=d; break; }
    }
    if(!pair){ Q.q.splice(Q.i,1); if(Q.i>=Q.q.length){ endDrill(); return; } showQ(); return; }
    Q.spot = {pair, want:B, picked:new Set()};
    b.innerHTML = '<div class="q"><div class="q-ask">دوسي على الكلمة (أو الكلمات) اللي مختلفة في الآية التانية.</div>'
      + '<div class="verse"><div class="ref">'+esc(refAr(pair[0]))+'<span class="juz">ج '+ar(juzOf(pair[0]))
      + '</span></div><div class="ayah sm">'+ayahHTML(pair[0])+"</div></div>"
      + '<div class="verse pin"><div class="ref">'+esc(refAr(pair[1]))+'<span class="juz">ج '+ar(juzOf(pair[1]))
      + '</span></div><div class="tapline" id="tap">'
      + D.verses[pair[1]][0].map((w,i)=>'<button class="tw" type="button" data-w="'+i+'" aria-pressed="false">'
          + esc(w)+"</button>").join("")+"</div></div>"
      + '<button class="btn block" type="button" id="checkSpot">تأكيد</button><div id="fb"></div></div>';
  }
  /* say it plainly when a compared spot sits outside what she says she memorised */
  if(c.v && !memoEmpty() && !(S.memo&&S.memo.all) && c.v.some(k=>!verseInMemo(k))){
    const ask = b.querySelector(".q-ask");
    if(ask) ask.insertAdjacentHTML("afterend",
      '<div class="outnote">فيه موضع من دول بره المحفوظ بتاعك — جاوبي عادي، '
      + "أو عدّلي محفوظك من الإعدادات.</div>");
  }
}
function finishQ(ok, c){
  Q.answered=true; Q.answeredOk=ok;
  grade(c, ok, Q.daily);
  S.day.n++; save();
  if(!ok && Q.again<12){            // bring it back later in the same session
    Q.again++;
    Q.q.splice(Math.min(Q.q.length, Q.i+3), 0, c);
  }
  $("#fb").innerHTML = '<div class="verdict '+(ok?"ok":"no")+'">'+(ok?"صح ✓":"غلط — ركّزي في ده")
    + "</div>" + '<div class="card" style="margin-top:12px">'+caseBody(c)+"</div>";
  $("#drillNext").textContent = Q.i+1 >= Q.q.length ? "إنهاء" : "التالي";
  $("#fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function nextQ(){
  if(!Q) return;
  if(!Q.answered) Q.skipped=(Q.skipped||0)+1;
  Q.i++;
  if(Q.i>=Q.q.length){ endDrill(); return; }
  showQ();
}
function endDrill(){
  const tot=Q.right+Q.wrong, sf=Q.self||{easy:0,hmm:0,hard:0};
  const stot=sf.easy+sf.hmm+sf.hard;
  $("#drillBar").style.width="100%";
  $("#drillBody").innerHTML = '<div class="sum-end">'
    + (tot ? '<div><div class="ring">'+ar(Math.round(Q.right/tot*100))+"٪</div>"
           + '<div class="muted">الموقع صحّح ليكي '+ar(tot)+" سؤال — "+ar(Q.right)+" صح</div></div>" : "")
    + (stot ? '<div class="card" style="text-align:right"><div class="wlab" style="margin-bottom:9px">'
           + "تقييمك لنفسك في "+ar(stot)+" سؤال (دول الموقع ما صحّحهمش):</div>"
           + '<div class="row" style="justify-content:space-between">'
           + [["سهلة",sf.easy],["اترددت",sf.hmm],["محتاجة مراجعة",sf.hard]].map(([l,n])=>
               '<div style="text-align:center;flex:1"><div style="font-size:1.3rem;font-weight:700">'
               + ar(n)+'</div><div class="muted" style="font-size:.73rem">'+l+"</div></div>").join("")
           + "</div></div>" : "")
    + (Q.skipped ? '<div class="muted">تخطّيتي '+ar(Q.skipped)+" سؤال.</div>" : "")
    + '<div class="muted">نطاق الجلسة: '+esc($("#drillTitle").textContent)+"</div>"
    + '<div class="muted">اللي غلطتي فيه أو قلتي عليه «محتاجة أراجعها» هيرجعلك بسرعة.</div>'
    + '</div>';
  $("#drillNext").textContent="تمام";
  Q.done=true;
}

/* ------------------------------------------------------------------ events */
document.addEventListener("click", e=>{
  const t = e.target;
  const tabBtn = t.closest(".tabs button");
  if(tabBtn){ tab=tabBtn.dataset.tab; browsePage=1; render(); return; }

  if(t.closest("#scopeBtn")){ openScope(); return; }
  const close = t.closest("[data-close]");
  if(close){
    const id=close.dataset.close;
    $("#"+id).hidden=true;
    if(id==="drill"){ Q=null; render(); }
    if(id==="learn"){ L=null; render(); }
    return;
  }
  const sc = t.closest("[data-scope]");
  if(sc){ S.scope=JSON.parse(sc.dataset.scope); save(); $("#scopeSheet").hidden=true;
          browsePage=1; render(); return; }

  if(t.closest("#setBtn")){ openSettings(); return; }
  const rc = t.closest("[data-rec]");
  if(rc){ S.reciter = rc.dataset.rec; save();

            String(b.dataset.rec===S.reciter)));

          toast("القارئ بقى "+reciterName());
          return; }
  const th = t.closest("[data-set-theme]");
  if(th){ S.theme=th.dataset.setTheme; applyPrefs(); save(); openSettings(); return; }
  const cb = t.closest("[data-set-cb]");
  if(cb){ S.cb = cb.dataset.setCb==="1"; applyPrefs(); save(); openSettings(); return; }
  const mm = t.closest("[data-set-memo]");
  if(mm){ const old=S.memo||{};
          S.memo = mm.dataset.setMemo==="all" ? {all:true}
                 : {all:false, juz:old.juz||[], sur:old.sur||[], ranges:old.ranges||[]};
          S.memoSet=true; save(); openSettings(); return; }
  const mj = t.closest("[data-mjuz]");
  if(mj){ const j=+mj.dataset.mjuz, o=S.memo||{}, list=(o.juz||[]).slice();
          const at=list.indexOf(j); if(at<0) list.push(j); else list.splice(at,1);
          S.memo={all:false, juz:list.sort((a,b)=>a-b), sur:o.sur||[], ranges:o.ranges||[]};
          S.memoSet=true; save();
          mj.setAttribute("aria-pressed", String(at<0));
          memoTouch(); return; }
  const msr = t.closest("[data-msur]");
  if(msr){ const n=+msr.dataset.msur, o=S.memo||{}, list=(o.sur||[]).slice();
           const at=list.indexOf(n); if(at<0) list.push(n); else list.splice(at,1);
           S.memo={all:false, juz:o.juz||[], sur:list.sort((a,b)=>a-b), ranges:o.ranges||[]};
           S.memoSet=true; save();
           msr.setAttribute("aria-pressed", String(at<0));
           memoTouch(); return; }

  /* ---- الصوت ---- */
  const ar_ = t.closest("[data-arec]");
  if(ar_){ recToggle(ar_.dataset.arec); return; }
  const ay = t.closest("[data-ayplay]");
  if(ay){ e.preventDefault(); playAyah(ay.dataset.ayplay, ay); return; }
  const ap = t.closest("[data-aplay]");
  if(ap){ const [kind, ...rest] = ap.dataset.aplay.split(":");
          audPlay(kind, rest.join(":")); return; }
  const ad = t.closest("[data-adel]");
  if(ad){ const [kind, ...rest] = ad.dataset.adel.split(":");
          audDel(kind, rest.join(":"));
          audRefresh();
          audMsg("اتمسح.");
          return; }

  if(t.closest("#grabWird")){
    const b=t.closest("#grabWird"); b.disabled=true;
    grabAyat(planKeys(), grabShow).then(()=>{ renderVoice(); grabShow(GRABMSG, GRABBAD); });
    return;
  }
  if(t.closest("#grabSur")){
    const n=SC[vSur];
    if(n > 200){ grabShow("السورة دي "+ar(n)+" آية — كبيرة قوي والتنزيل هياخد وقت طويل. "
                        + "نزّلي وردك اليومي بدل كده.", true);
      return; }
    const b=t.closest("#grabSur"); b.disabled=true;
    const ks=Array.from({length:n},(_,i)=>vSur+":"+(i+1));
    grabAyat(ks, grabShow).then(()=>{ renderVoice(); grabShow(GRABMSG, GRABBAD); });
    return;
  }

  /* ---- البحث والصحوة ---- */
  if(t.closest("#searchBtn")){
    $("#searchSheet").hidden=false; renderSearch();
    const i=$("#q"); if(i) setTimeout(()=>i.focus(), 60);
    return;
  }
  if(t.closest("#cheerNext")){
    S.cheer=(S.cheer||0)+1; save();
    $("#cheerBox").textContent = CHEERS[(daySeed()+S.cheer)%CHEERS.length];
    return;
  }
  const sa = t.closest("[data-sact]");
  if(sa){
    const a=sa.dataset.sact;
    if(a==="learn"){ tab="memo"; render(); window.scrollTo(0,0); }
    else if(a==="review"){ const q=dailyQueue();
      if(q.length) startDrill(q,"مراجعة النهاردة",true); else { tab="today"; render(); } }
    else if(a==="recite"){ startDrill(recitationQueue(12),"تسميع",true); }
    else if(a==="tashabuh"){ tab="browse"; render(); window.scrollTo(0,0); }
    else if(a==="less"){
      if(S.plan){ S.plan.perDay=1; save(); }
      sa.textContent="تمام، بقى آية واحدة ✓"; sa.disabled=true;
    }
    return;
  }

  /* ---- ورد الحفظ ---- */
  const pd = t.closest("[data-pd]");
  if(pd){ $$("[data-pd]").forEach(b=>b.setAttribute("aria-pressed",
            String(b.dataset.pd===pd.dataset.pd))); return; }
  if(t.closest("#planGo")){
    const sn = +$("#planS").value;
    const per = +($$("[data-pd]").find(b=>b.getAttribute("aria-pressed")==="true")||{dataset:{pd:3}}).dataset.pd;
    S.plan = {from:sn+":1", cur:sn+":1", perDay:per, day:"", total:0};
    save(); renderMemo(); window.scrollTo(0,0); return;
  }
  if(t.closest("#planEdit")){ S.plan=null; save(); renderMemo(); window.scrollTo(0,0); return; }
  if(t.closest("#planBack")){
    const i = ALLK.indexOf(S.plan.cur);
    if(i > 0){ S.plan.cur = ALLK[i-1]; S.plan.total = Math.max(0,(S.plan.total||0)-1);
               S.plan.day = ""; save(); renderMemo(); }
    return;
  }
  if(t.closest("#learnGo")){
    const ks = planKeys();
    if(ks.length) startLearn(ks, "حفظ — "+planLabel());
    return;
  }
  if(t.closest("#lRep")){
    if(L.stage === 3){
      L.reps++;
      if(L.reps >= L_REPS[3]){ L.reps=0; L.shown=false; learnAfterLink(); }
      showLearn(); return;
    }
    learnStep(); return;
  }
  if(t.closest("#lShow")){ L.shown = !L.shown; showLearn(); return; }
  if(t.closest("#lFinish")){ finishLearn(); return; }

  /* ---- تشيك ليست الحفظ ---- */
  const cj = t.closest("[data-cj]");
  if(cj){ const n=+cj.dataset.cj, v=(chkJ(n)+1)%4;
          chk().j[n]=v; save();
          cj.className="cbtn s"+v; cj.querySelector("small").textContent=CHK_J[v];
          chkTouch(); return; }
  const cs = t.closest("[data-cs]");
  if(cs){ const n=+cs.dataset.cs, v=(chkS(n)+1)%4;
          chk().s[n]=v; save();
          cs.className="cbtn s"+v; cs.textContent=CHK_S[v];
          cs.closest(".srow").dataset.st=String(v);
          chkTouch(); return; }
  const cf = t.closest("[data-cfilter]");
  if(cf){ chkFilter=cf.dataset.cfilter;
          $$("[data-cfilter]").forEach(b=>b.setAttribute("aria-pressed",
            String(b.dataset.cfilter===chkFilter)));
          const l=$("#chkList");
          if(l){ if(chkFilter==="all") delete l.dataset.f; else l.dataset.f=chkFilter; }
          return; }
  if(t.closest("#chkDrill")){
    const need=needSur();
    const list=CASES.filter(c=>c.s.some(x=>need.includes(x)));
    if(list.length) startDrill(list, "السور اللي محتاجة مراجعة");
    return;
  }
  if(t.closest("#chkMemo")){
    const need=needSur(), o=S.memo||{};
    S.memo={all:false, juz:o.juz||[], sur:[...new Set((o.sur||[]).concat(need))].sort((a,b)=>a-b),
            ranges:o.ranges||[]};
    S.memoSet=true; save();
    const b=t.closest("#chkMemo"), was=b.textContent;
    b.textContent="اتحطّت في محفوظك ✓"; b.disabled=true;
    setTimeout(()=>{ b.textContent=was; b.disabled=false; }, 2200);
    return;
  }
  if(t.closest("#rgAdd")){
    const s=+$("#rgS").value, a=+$("#rgA").value, b=+$("#rgB").value;
    if(s && a>=1 && b>=a && b<=SC[s]){
      const o=S.memo||{};
      S.memo={all:false, juz:o.juz||[], sur:o.sur||[],
              ranges:(o.ranges||[]).concat([{s,a,b}])};
      S.memoSet=true; save(); openSettings();
    } else {
      const bb=$("#rgB"); if(bb){ bb.setAttribute("aria-invalid","true"); bb.focus(); }
    }
    return;
  }
  const rgd = t.closest("[data-rgdel]");
  if(rgd){ const o=S.memo||{}, list=(o.ranges||[]).slice();

           S.memo={all:false, juz:o.juz||[], sur:o.sur||[], ranges:list};
           save(); openSettings(); return; }

      bkMsg("اتسجّل "+ar(Object.keys(o.cards).length)+" موضع");

    if(bk.dataset.back==="juz" && S.juz) S.surah=0; else { S.surah=0; S.juz=0; }
    save(); renderMemo(); window.scrollTo(0,0); return;
  }
  const qr = t.closest("[data-qrecite]");
  if(qr){
    const x=QTR.find(z=>z.q===+qr.dataset.qrecite);
    const ks=shuffle(rangeKeys(x.from,x.to).slice()).slice(0,12);
    startDrill(ks.map(k=>({id:"a:"+k, t:"ayah", v:[k], j:[juzOf(k)], s:[+k.split(":")[0]]})),
               "تسميع — "+rangeLabel(x.from,x.to), true);
    return;
  }
  const qd = t.closest("[data-qdrill]");
  if(qd){
    const x=QTR.find(z=>z.q===+qd.dataset.qdrill);
    startDrill(casesInRange(x.from,x.to), "متشابهات — "+rangeLabel(x.from,x.to));

    const x=QTR.find(z=>z.q===+qn.dataset.q), box=$("#qdetail");
    if(box && x){
      box.innerHTML = '<h2 class="sec">'+esc(rangeLabel(x.from,x.to))+"</h2>"

      window.scrollTo(0, box.getBoundingClientRect().top+window.scrollY-70);
    }
    return;
  }
  const gt = t.closest("[data-go]");
  if(gt){ tab=gt.dataset.go; render(); window.scrollTo(0,0); return; }

  const ss = t.closest("[data-sscope]");
  if(ss){ searchScope=ss.dataset.sscope;
          $$("[data-sscope]").forEach(b=>b.setAttribute("aria-pressed",
            String(b.dataset.sscope===searchScope)));
          if($("#q") && $("#q").value.trim()) doSearch();
          return; }
  const bt = t.closest("[data-bt]");
  if(bt){ browseType=bt.dataset.bt; browsePage=1; renderBrowse(); return; }
  if(t.closest("#more")){ browsePage++; renderBrowse(); return; }

  const det = t.closest("details.case");
  if(det && t.closest("summary")){
    const body=$(".body",det);
    if(!body.dataset.filled){ body.innerHTML = caseBody(CASES[+det.dataset.case]); body.dataset.filled="1"; }
  }
  const one = t.closest("[data-drillone]");
  if(one){ startDrill([CASES[+one.dataset.drillone]], "تدريب على موضع"); return; }
  const goto = t.closest("[data-goto]");
  if(goto){ startDrill([CASES[+goto.dataset.goto]], "تدريب على موضع"); return; }

  /* ---- وِردي ---- */
  const wn = t.closest("#wNext");
  if(wn){ S.wird = (S.wird||0)+1; save(); renderWird(); window.scrollTo(0,0); return; }
  const ws = t.closest("[data-wsur]");
  if(ws){ S.surah = +ws.dataset.wsur; S.juz = 0; tab = "memo"; save(); render();
          window.scrollTo(0,0); return; }
  const dc = t.closest("[data-dh]");
  if(dc){
    const id = dc.dataset.dh, z = dhFind(id);
    if(!z) return;
    rollWird();
    const n = z.n||1;
    let c = ((S.dh.c[id]||0)+1); if(c>n) c = 0;
    S.dh.c[id] = c; save();
    dc.querySelector("b").textContent = ar(c);
    dc.querySelector("small").textContent = c>=n ? "تمّت" : "من "+ar(n);
    dc.classList.toggle("done", c>=n);
    return;
  }
  const dd = t.closest("[data-dhdel]");
  if(dd){ S.myDh = (S.myDh||[]).filter(z=>z.id!==dd.dataset.dhdel); save(); renderWird(); return; }
  if(t.closest("#dhAdd")){
    const nm = ($("#dhNm").value||"").trim(), tx = ($("#dhT").value||"").trim();
    const n = Math.max(1, Math.min(1000, +$("#dhN").value||1));
    if(!tx){ $("#dhT").focus(); return; }
    S.myDh = (S.myDh||[]).concat([{id:"u"+Date.now().toString(36), u:1,
                                   nm:nm||tx.slice(0,22), t:tx, n:n}]);
    save(); renderWird(); return;
  }
  const tkb = t.closest("[data-task]");
  if(tkb){
    rollWird();
    const id = tkb.dataset.task, on = !S.wd.done[id];
    if(on) S.wd.done[id] = 1; else delete S.wd.done[id];
    const list = todayTasks();
    if(taskFull(list) && S.wd.full!==localDay()){
      const prev = S.wd.full, y = localDay(Date.now()-DAY);
      S.wd.streak = (prev===y) ? (S.wd.streak||0)+1 : 1;
      S.wd.full = localDay();
    }
    save();
    tkb.closest(".tk").classList.toggle("on", on);
    const done = list.filter(x=>S.wd.done[x.id]).length;
    const bar = $("#v-wird .prog i"); if(bar) bar.style.width = Math.round(done/list.length*100)+"%";
    const msg = $("#tkMsg"); if(msg) msg.textContent = taskMsg(list);
    return;
  }
  const wq = t.closest("[data-wq]");
  if(wq){
    const x = QTR.find(z=>z.q===+wq.dataset.wq), box = $("#wdetail");
    if(box && x){
      box.innerHTML = '<h2 class="sec">'+esc(rangeLabel(x.from,x.to))+"</h2>"
        + '<div class="page-node">'+ayahListHTML(x.from,x.to)+"</div>";
      window.scrollTo(0, box.getBoundingClientRect().top+window.scrollY-70);
    }
    return;
  }
  const wdh = t.closest("[data-wdh]");
  if(wdh){
    const id = wdh.dataset.wdh;
    const box = [...$$("#v-wird .dgrp")].find(d=>d.querySelector('[data-dh="'+id+'"]'));
    if(box){ box.open = true;
             const row = box.querySelector('[data-dh="'+id+'"]');
             window.scrollTo(0, row.getBoundingClientRect().top+window.scrollY-120);
             row.focus(); }
    return;
  }
  if(t.closest("#wGo")){ startDrill(dailyQueue(), "مراجعة النهاردة", true); return; }
  if(t.closest("#wRec")){ startDrill(recitationQueue(12), "تسميع", true); return; }

  if(t.closest("#go")){ startDrill(dailyQueue(), "مراجعة النهاردة", true); return; }
  if(t.closest("#goFree")){ startDrill(CASES.filter(c=>inScope(c)&&inMemo(c)), "تدريب حر"); return; }
  if(t.closest("#goShaky")){ startDrill(shakyCases(), "أخطائي"); return; }
  if(t.closest("#goRecite")){ startDrill(recitationQueue(12), "تسميع", true); return; }
  if(t.closest("#drillHere")){
    startDrill(CASES.filter(c=>grp(c)===browseType&&inScope(c)), TYPE_AR[browseType]+" — "+scopeLabel()); return;
  }

  /* quiz answers */
  const opt = t.closest(".opt:not(.rate)");
  if(opt && Q && !Q.answered){
    const c=Q.q[Q.i], correct=$("#drillBody").dataset.correct;
    const ok = String(opt.dataset.ans)===String(correct);
    $$(".opt").forEach(o=>{
      o.disabled=true;
      if(String(o.dataset.ans)===String(correct)){ o.classList.add("right");
        o.insertAdjacentHTML("beforeend",'<span class="mk">الصح</span>'); }
      else if(o===opt){ o.classList.add("wrong");
        o.insertAdjacentHTML("beforeend",'<span class="mk">اختيارك</span>'); }
    });
    ok?Q.right++:Q.wrong++;
    finishQ(ok,c); return;
  }
  const tw = t.closest(".tw");
  if(tw && Q && !Q.answered){
    const i=+tw.dataset.w, on=tw.getAttribute("aria-pressed")==="true";
    tw.setAttribute("aria-pressed", String(!on));
    on?Q.spot.picked.delete(i):Q.spot.picked.add(i);
    return;
  }
  if(t.closest("#checkSpot") && Q && !Q.answered){
    const want=Q.spot.want, got=Q.spot.picked;
    let ok = want.size===got.size;
    if(ok) for(const x of want) if(!got.has(x)){ ok=false; break; }
    $$("#tap .tw").forEach(b=>{
      const i=+b.dataset.w;
      b.disabled=true;
      if(want.has(i)&&got.has(i)) b.classList.add("ok");
      else if(want.has(i)) b.classList.add("miss");
      else if(got.has(i)) b.classList.add("bad");
    });
    $("#checkSpot").hidden=true;
    ok?Q.right++:Q.wrong++;
    finishQ(ok, Q.q[Q.i]); return;
  }
  if(t.closest("#reveal") && Q && !Q.answered){ revealAnswer(); return; }
  const rt = t.closest("[data-rate]");
  if(rt && Q && !Q.answered){ finishSelf(rt.dataset.rate, Q.q[Q.i]); return; }
  if(t.closest("#drillNext")){
    if(Q&&Q.done){ $("#drill").hidden=true; Q=null; render(); return; }
    nextQ(); return;
  }
});
document.addEventListener("change", e=>{
  if(e.target && e.target.id === "vSur"){ vSur = +e.target.value; vAyah = 1; renderVoice(); return; }
  if(e.target && e.target.id === "vAyah"){ vAyah = +e.target.value; renderVoice(); return; }
  const up = e.target.closest ? e.target.closest("[data-aup]") : null;
  if(!up || !up.files || !up.files[0]) return;
  const k = up.dataset.aup, f = up.files[0];
  audPutBlob("sh", k, f).then(err=>{
    audRefresh();
    audMsg(err || "اتحفظ ✓ صوت الشيخ للآية دي.", !!err);
  });
  up.value = "";
});
document.addEventListener("toggle", e=>{
  if(e.target && e.target.classList && e.target.classList.contains("pickbox"))
    pickOpen = e.target.open;
}, true);
document.addEventListener("input", e=>{
  const n=e.target.closest("[data-note]");
  if(!n) return;
  S.notes[n.dataset.note]=n.value; save();
  const tagEl=$(".saved", n.closest(".note"));
  if(tagEl){ tagEl.classList.add("on"); clearTimeout(tagEl._t);
             tagEl._t=setTimeout(()=>tagEl.classList.remove("on"),1200); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){
    if(!$("#drill").hidden){ $("#drill").hidden=true; Q=null; render(); }
    else if(!$("#scopeSheet").hidden) $("#scopeSheet").hidden=true;
    else if(!$("#setSheet").hidden) $("#setSheet").hidden=true;
  }
});
boot();
</script>

if("serviceWorker" in navigator){
  addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
