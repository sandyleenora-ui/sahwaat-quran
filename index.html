<meta charset="utf-8">

<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0d6b4c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta property="og:description" content="تطبيق يسهّل حفظ القرآن: المتشابهات والمتطابقات في المصحف كله، مراجعة يومية، تسميع، وورد وأذكار.">

<style>
/* Layout: one reading column, sticky scope bar on top, tab bar pinned to the bottom.
   Palette taken from a printed mushaf: greenish paper, ink, a single emerald rule,
   and a set of marker colours reserved for the differing word. */
:root{
  --paper:#eceeea; --card:#ffffff; --card2:#f5f7f3;
  --ink:#15201b; --ink2:#4a5a51; --ink3:#7b8a81;
  --line:#dbe1da; --line2:#c6cfc6;
  --emerald:#0d6b4c; --emerald-soft:#e3f0e8; --on-emerald:#ffffff;
  --gold:#8a6410;
  --makki:#8a5a12; --makki-bg:#f6ecd9; --madani:#13614a; --madani-bg:#dcefe4;
  --ok:#17683f; --ok-bg:#e2f1e7; --no:#9c2b2b; --no-bg:#fbe7e5;
  --m1:#a1541a; --m1b:#fbeadb; --m2:#9c2550; --m2b:#fde7ee;
  --m3:#5b43a8; --m3b:#eee9fb; --m4:#1b6079; --m4b:#e2f0f6;
  --m5:#4e6a14; --m5b:#eef3dc; --m6:#8c4a86; --m6b:#f8e9f6;
  --ui:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --quran:"Amiri Quran","Amiri","Traditional Arabic",serif;
  --r:14px; --shadow:0 1px 2px rgba(20,40,30,.06),0 6px 18px rgba(20,40,30,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1412; --card:#161e1b; --card2:#1c2521;
  --ink:#e7ece8; --ink2:#a6b4ac; --ink3:#7c8c83;
  --line:#26312c; --line2:#334039;
  --emerald:#49c79a; --emerald-soft:#13302a; --on-emerald:#06130f;
  --gold:#d9ab4e;
  --makki:#dcae5c; --makki-bg:#332710; --madani:#5ac89e; --madani-bg:#0e2f25;
  --ok:#5fd09a; --ok-bg:#122e23; --no:#f08f86; --no-bg:#331a18;
  --m1:#eba35e; --m1b:#3a2715; --m2:#f08aab; --m2b:#3a1b26;
  --m3:#b4a2f0; --m3b:#241f3c; --m4:#6fc2dd; --m4b:#132c35;
  --m5:#b4cc6a; --m5b:#242d14; --m6:#e2a3dc; --m6b:#331f31;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0e1412; --card:#161e1b; --card2:#1c2521;
  --ink:#e7ece8; --ink2:#a6b4ac; --ink3:#7c8c83;
  --line:#26312c; --line2:#334039;
  --emerald:#49c79a; --emerald-soft:#13302a; --on-emerald:#06130f;
  --gold:#d9ab4e;
  --makki:#dcae5c; --makki-bg:#332710; --madani:#5ac89e; --madani-bg:#0e2f25;
  --ok:#5fd09a; --ok-bg:#122e23; --no:#f08f86; --no-bg:#331a18;
  --m1:#eba35e; --m1b:#3a2715; --m2:#f08aab; --m2b:#3a1b26;
  --m3:#b4a2f0; --m3b:#241f3c; --m4:#6fc2dd; --m4b:#132c35;
  --m5:#b4cc6a; --m5b:#242d14; --m6:#e2a3dc; --m6b:#331f31;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
/* the reader's own choice, set on the page; it comes after the two blocks above so it wins */
:root[data-app="light"]{
  --paper:#eceeea; --card:#ffffff; --card2:#f5f7f3;
  --ink:#15201b; --ink2:#4a5a51; --ink3:#7b8a81;
  --line:#dbe1da; --line2:#c6cfc6;
  --emerald:#0d6b4c; --emerald-soft:#e3f0e8; --on-emerald:#ffffff;
  --gold:#8a6410;
  --makki:#8a5a12; --makki-bg:#f6ecd9; --madani:#13614a; --madani-bg:#dcefe4;
  --ok:#17683f; --ok-bg:#e2f1e7; --no:#9c2b2b; --no-bg:#fbe7e5;
  --m1:#a1541a; --m1b:#fbeadb; --m2:#9c2550; --m2b:#fde7ee;
  --m3:#5b43a8; --m3b:#eee9fb; --m4:#1b6079; --m4b:#e2f0f6;
  --m5:#4e6a14; --m5b:#eef3dc; --m6:#8c4a86; --m6b:#f8e9f6;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 6px 18px rgba(20,40,30,.05);
  color-scheme:light;
}
:root[data-app="dark"]{
  --paper:#0e1412; --card:#161e1b; --card2:#1c2521;
  --ink:#e7ece8; --ink2:#a6b4ac; --ink3:#7c8c83;
  --line:#26312c; --line2:#334039;
  --emerald:#49c79a; --emerald-soft:#13302a; --on-emerald:#06130f;
  --gold:#d9ab4e;
  --makki:#dcae5c; --makki-bg:#332710; --madani:#5ac89e; --madani-bg:#0e2f25;
  --ok:#5fd09a; --ok-bg:#122e23; --no:#f08f86; --no-bg:#331a18;
  --m1:#eba35e; --m1b:#3a2715; --m2:#f08aab; --m2b:#3a1b26;
  --m3:#b4a2f0; --m3b:#241f3c; --m4:#6fc2dd; --m4b:#132c35;
  --m5:#b4cc6a; --m5b:#242d14; --m6:#e2a3dc; --m6b:#331f31;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
/* colour-blind-safe markers (Okabe-Ito); the numbered badge and the border
   style carry the same information, so colour is never the only signal */
:root[data-cb="1"]{
  --m1:#8f5600; --m1b:#fae9d2; --m2:#00627c; --m2b:#dcf0f6;
  --m3:#006b4f; --m3b:#d9f0e6; --m4:#8a3f74; --m4b:#f7e4f1;
  --m5:#1b4f9c; --m5b:#e0e9f9; --m6:#9c3115; --m6b:#fae3dc;
}
:root[data-cb="1"][data-app="dark"],
:root[data-cb="1"][data-theme="dark"]{
  --m1:#e69f00; --m1b:#3a2a08; --m2:#56b4e9; --m2b:#0f2a38;
  --m3:#49c79a; --m3b:#0e2e25; --m4:#cc79a7; --m4b:#331f2b;
  --m5:#8fb0ef; --m5b:#1b2540; --m6:#e2714a; --m6b:#3a2017;
}
@media (prefers-color-scheme:dark){:root[data-cb="1"]:not([data-app="light"]):not([data-theme="light"]){
  --m1:#e69f00; --m1b:#3a2a08; --m2:#56b4e9; --m2b:#0f2a38;
  --m3:#49c79a; --m3b:#0e2e25; --m4:#cc79a7; --m4b:#331f2b;
  --m5:#8fb0ef; --m5b:#1b2540; --m6:#e2714a; --m6b:#3a2017;
}}
:root[data-cb="1"] .pg.c2,:root[data-cb="1"] .fill.c2{border-inline-start-style:dashed}
:root[data-cb="1"] .pg.c3,:root[data-cb="1"] .fill.c3{border-inline-start-style:dotted;border-inline-start-width:4px}
:root[data-cb="1"] .pg.c4,:root[data-cb="1"] .fill.c4{border-inline-start-style:double;border-inline-start-width:5px}
:root[data-cb="1"] .pg.c5,:root[data-cb="1"] .fill.c5{border-inline-start-style:dashed;border-inline-start-width:5px}
:root[data-cb="1"] .pg.c6,:root[data-cb="1"] .fill.c6{border-inline-start-style:dotted;border-inline-start-width:6px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);line-height:1.6;
  direction:rtl;text-align:right;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:40;background:var(--card)}
.wrap{width:100%;max-width:680px;margin-inline:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--emerald);outline-offset:2px;border-radius:6px}

/* ---- header ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--card);
  border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;min-height:56px}
.brand{font-weight:700;font-size:1.05rem;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--emerald)}
.scope{margin-inline-start:auto;display:flex;align-items:center;gap:6px;background:var(--emerald-soft);
  color:var(--emerald);border:1px solid transparent;border-radius:999px;padding:7px 13px;
  font-size:.82rem;font-weight:600;max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scope:hover{border-color:var(--emerald)}

/* ---- shell ---- */
main{padding-block:18px 96px;min-height:60vh}
h2.sec{font-size:.78rem;font-weight:700;letter-spacing:.06em;color:var(--ink3);
  margin:26px 0 10px;text-transform:none}
h2.sec:first-child{margin-top:0}

/* ---- tab bar ---- */
.tabs{position:fixed;inset:auto 0 0 0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:flex;padding-block:6px}
.tabs button{flex:1;background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--ink3);font-size:.7rem;font-weight:600;border-radius:10px}
.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--emerald)}

/* ---- cards ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* hero on today */
.hero{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.hijri{font-size:.76rem;color:var(--ink3);font-weight:600;letter-spacing:.02em}
.hero h1{margin:0;font-size:1.45rem;line-height:1.35;letter-spacing:-.02em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--emerald)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{background:var(--card2);padding:11px 8px;text-align:center}
.stat b{display:block;font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.stat small{font-size:.7rem;color:var(--ink3);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;
  padding:13px 18px;font-weight:700;font-size:.95rem;background:var(--emerald);color:var(--on-emerald)}
.btn.block{width:100%}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line2)}
.btn[disabled]{opacity:.45;cursor:default}

/* ---- case card ---- */
.case{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  box-shadow:var(--shadow)}
.case>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;gap:10px;align-items:flex-start}
.case>summary::-webkit-details-marker{display:none}
.case[open]>summary{border-bottom:1px solid var(--line);background:var(--card2)}
.case .sum-body{flex:1;min-width:0}
.case .sum-title{font-family:var(--quran);font-size:1.06rem;line-height:2;display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.case .sum-meta{font-size:.73rem;color:var(--ink3);font-weight:600;margin-top:3px}
.case .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px}
.tag{flex:none;font-size:.66rem;font-weight:700;padding:4px 8px;border-radius:7px;
  background:var(--emerald-soft);color:var(--emerald);white-space:nowrap;margin-top:4px}
.tag.t-identical{background:var(--m4b);color:var(--m4)}
.tag.t-similar{background:var(--m3b);color:var(--m3)}
.tag.t-frame{background:var(--m3b);color:var(--m3)}
.tag.t-phrase{background:var(--m5b);color:var(--m5)}

/* ---- ayah typography ---- */
.ayah{font-family:var(--quran);font-size:1.26rem;line-height:2.5;color:var(--ink);
  word-spacing:.04em}
.ayah.sm{font-size:1.12rem;line-height:2.3}
.ayah .hl{font-weight:inherit;color:var(--m1);background:var(--m1b);border-radius:5px;
  padding:1px 4px;margin:0 -1px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.ayah .hl.c2{color:var(--m2);background:var(--m2b)} .ayah .hl.c3{color:var(--m3);background:var(--m3b)}
.ayah .hl.c4{color:var(--m4);background:var(--m4b)} .ayah .hl.c5{color:var(--m5);background:var(--m5b)}
.ayah .hl.c6{color:var(--m6);background:var(--m6b)}
.ayah .blank{display:inline-block;min-width:68px;border-bottom:2.5px dashed var(--emerald);
  vertical-align:-2px;margin:0 5px}
/* the exact letters that differ, inside an already-highlighted word */
.lt{text-decoration:none;color:inherit;box-shadow:0 3px 0 currentColor;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
.fill .w .lt{box-shadow:0 4px 0 currentColor}
.verse{display:flex;flex-direction:column;gap:5px;padding:11px 13px;background:var(--card2);
  border-radius:11px;border:1px solid var(--line)}
.verse.pin{border-color:var(--emerald);background:var(--emerald-soft)}
.ref{font-size:.74rem;font-weight:700;color:var(--ink2);display:flex;gap:7px;align-items:center;
  flex-wrap:wrap}
.ref .juz{font-weight:600;color:var(--ink3);font-size:.7rem;background:var(--card);
  border:1px solid var(--line);border-radius:6px;padding:1px 6px}

/* places list */
.places{display:flex;flex-wrap:wrap;gap:6px}
.place{font-size:.76rem;font-weight:600;background:var(--card2);border:1px solid var(--line);
  border-radius:8px;padding:5px 9px;color:var(--ink2);font-variant-numeric:tabular-nums}
.place.on{background:var(--emerald-soft);border-color:var(--emerald);color:var(--emerald)}

/* makki / madani marker */
.rev{flex:none;font-size:.66rem;font-weight:700;border-radius:999px;padding:2px 8px;
  background:var(--makki-bg);color:var(--makki)}
.rev.madani{background:var(--madani-bg);color:var(--madani)}

/* places grouped by surah */
.pgroups{display:flex;flex-direction:column;gap:8px}
.pg{border:1px solid var(--line);border-inline-start:3px solid var(--line2);border-radius:10px;
  padding:8px 11px;background:var(--card2);display:flex;align-items:center;
  flex-wrap:wrap;gap:6px 10px}
.pg-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:none}
.pg-h b{font-size:.94rem}
.pg-meta{color:var(--ink3);font-weight:600;font-size:.74rem}
.pg-a{display:flex;flex-wrap:wrap;gap:5px}
.ano{font-size:.74rem;font-weight:700;font-variant-numeric:tabular-nums;border-radius:7px;
  padding:3px 9px;background:var(--card);border:1px solid var(--line);color:var(--ink2)}
.pg.c1{border-inline-start-color:var(--m1)}.pg.c1 .pg-h b{color:var(--m1)}
.pg.c1 .ano{background:var(--m1b);color:var(--m1);border-color:transparent}
.pg.c2{border-inline-start-color:var(--m2)}.pg.c2 .pg-h b{color:var(--m2)}
.pg.c2 .ano{background:var(--m2b);color:var(--m2);border-color:transparent}
.pg.c3{border-inline-start-color:var(--m3)}.pg.c3 .pg-h b{color:var(--m3)}
.pg.c3 .ano{background:var(--m3b);color:var(--m3);border-color:transparent}
.pg.c4{border-inline-start-color:var(--m4)}.pg.c4 .pg-h b{color:var(--m4)}
.pg.c4 .ano{background:var(--m4b);color:var(--m4);border-color:transparent}
.pg.c5{border-inline-start-color:var(--m5)}.pg.c5 .pg-h b{color:var(--m5)}
.pg.c5 .ano{background:var(--m5b);color:var(--m5);border-color:transparent}
.pg.c6{border-inline-start-color:var(--m6)}.pg.c6 .pg-h b{color:var(--m6)}
.pg.c6 .ano{background:var(--m6b);color:var(--m6);border-color:transparent}

/* numbered badge — the same information the colour carries */
.idx{flex:none;min-width:21px;height:21px;padding:0 5px;border-radius:7px;display:inline-flex;
  align-items:center;justify-content:center;font-size:.72rem;font-weight:700;
  background:var(--line);color:var(--ink2);font-variant-numeric:tabular-nums}
.pg.c1 .idx,.fill.c1 .idx{background:var(--m1);color:var(--card)}
.pg.c2 .idx,.fill.c2 .idx{background:var(--m2);color:var(--card)}
.pg.c3 .idx,.fill.c3 .idx{background:var(--m3);color:var(--card)}
.pg.c4 .idx,.fill.c4 .idx{background:var(--m4);color:var(--card)}
.pg.c5 .idx,.fill.c5 .idx{background:var(--m5);color:var(--card)}
.pg.c6 .idx,.fill.c6 .idx{background:var(--m6);color:var(--card)}

/* surah map */
.sur-head{display:flex;flex-direction:column;gap:9px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.sur-head h1{margin:0;font-size:1.5rem;letter-spacing:-.02em}
.sur-head h1 small{font-size:.8rem;color:var(--ink3);font-weight:600;margin-inline-start:8px}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{font-size:.74rem;font-weight:600;background:var(--card2);border:1px solid var(--line);
  border-radius:8px;padding:4px 9px;color:var(--ink2);font-variant-numeric:tabular-nums}
.opening{display:inline-flex;align-items:center;gap:7px;background:var(--emerald-soft);color:var(--emerald);
  border-radius:9px;padding:7px 11px;font-size:.82rem;font-weight:700}
.spine{display:flex;flex-direction:column;gap:10px;position:relative}
.page-node{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.page-node>.ph{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--card2);
  border-bottom:1px solid var(--line);font-size:.76rem;font-weight:700;color:var(--ink2)}
.page-node>.ph b{color:var(--emerald);font-variant-numeric:tabular-nums}
.alist{display:flex;flex-direction:column}
.aitem{border-top:1px solid var(--line)}
.aitem:first-child{border-top:0}
.aitem>summary{list-style:none;cursor:pointer;display:flex;gap:9px;align-items:baseline;
  padding:8px 12px;flex-wrap:wrap}
.aitem>summary::-webkit-details-marker{display:none}
.aitem>summary:hover{background:var(--card2)}
.anum{flex:none;min-width:26px;white-space:nowrap;font-size:.72rem;font-weight:700;color:var(--ink3);
  font-variant-numeric:tabular-nums}
.ahead{font-family:var(--quran);font-size:1.02rem;line-height:1.9;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aitem[open]>summary{background:var(--emerald-soft)}
.aitem[open] .ahead{white-space:normal;overflow:visible}
.afull{padding:4px 12px 13px;font-family:var(--quran);font-size:1.14rem;line-height:2.4}
.flag{flex:none;font-size:.64rem;font-weight:700;border-radius:6px;padding:2px 6px;
  background:var(--m1b);color:var(--m1)}
.flag.rep{background:var(--emerald-soft);color:var(--emerald)}
.flag.t-identical{background:var(--m4b);color:var(--m4)}
.flag.t-similar{background:var(--m3b);color:var(--m3)}
.flag.t-frame{background:var(--m3b);color:var(--m3)}
.awhere{padding:2px 12px 14px;display:flex;flex-direction:column;gap:12px}
.wcase{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.whead{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;background:var(--card2);
  border-bottom:1px solid var(--line)}
.whead .tag{margin-top:0}
.wbody{padding:12px;display:flex;flex-direction:column;gap:10px}
.wlab{font-size:.76rem;font-weight:700;color:var(--ink2);line-height:1.65}

/* سلسلة التربيط */
.rbchain{display:flex;flex-direction:column}
.rb{display:flex;gap:11px;align-items:flex-start;padding:7px 0;position:relative}
.rb::before{content:"";position:absolute;inset-inline-start:13px;top:32px;bottom:-7px;
  width:2px;background:var(--line2)}
.rb:last-child::before{display:none}
.rb-n{flex:none;width:28px;height:28px;border-radius:9px;background:var(--emerald-soft);
  color:var(--emerald);display:flex;align-items:center;justify-content:center;font-size:.75rem;
  font-weight:700;font-variant-numeric:tabular-nums;position:relative;z-index:1;margin-top:4px}
.rb-b{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:11px;
  padding:9px 12px;display:flex;flex-direction:column;gap:5px}
.rb-head{font-family:var(--quran);font-size:1.08rem;line-height:2}
.rb-end{font-size:.77rem;color:var(--ink3);font-weight:600;display:flex;gap:8px;
  align-items:center;flex-wrap:wrap}
.rb-end b{font-family:var(--quran);font-size:1.04rem;color:var(--emerald);font-weight:400}
.rb-warn{background:var(--m2b);color:var(--m2);border-radius:7px;padding:2px 8px;
  font-size:.67rem;font-weight:700}

/* drawn mind map */
.mmap{display:block;width:100%;max-width:470px;margin:0 auto;overflow:visible}
.mroot{background:var(--emerald);color:var(--on-emerald);border-radius:14px;padding:8px 11px;
  text-align:center;font-weight:700;font-size:15px;line-height:1.4;font-family:var(--ui);
  height:100%;display:flex;align-items:center;justify-content:center}
.mnode{border:1.5px solid;border-radius:13px;padding:7px 10px;font-family:var(--ui);height:100%;
  display:flex;flex-direction:column;gap:1px;justify-content:center;cursor:default;
  line-height:1.45;overflow:hidden}
.mnode[data-q]{cursor:pointer}
.mnode b{font-size:13px;font-weight:700}
.mnode span{font-size:10.5px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:block}
.mnode.c1{background:var(--m1b);border-color:var(--m1);color:var(--m1)}
.mnode.c2{background:var(--m2b);border-color:var(--m2);color:var(--m2)}
.mnode.c3{background:var(--m3b);border-color:var(--m3);color:var(--m3)}
.mnode.c4{background:var(--m4b);border-color:var(--m4);color:var(--m4)}
.mnode.c5{background:var(--m5b);border-color:var(--m5);color:var(--m5)}
.mnode.c6{background:var(--m6b);border-color:var(--m6);color:var(--m6)}

/* the written link between two surahs */
.linkbox{background:var(--makki-bg);border:1px solid var(--makki);border-radius:13px;
  padding:12px 15px;display:flex;flex-direction:column;gap:3px}
.linkbox b{font-size:.72rem;font-weight:700;color:var(--makki);letter-spacing:.04em}
.linkbox p{margin:0;font-size:1.02rem;line-height:1.8;font-weight:600}
.linkbox small{color:var(--ink3);font-size:.69rem;margin-top:4px}

/* surah chain */
.chain{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:stretch}
.cnode{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px;
  display:flex;flex-direction:column;gap:4px;text-align:center;min-width:0}
.cnode b{font-size:.98rem}
.cnode small{font-size:.7rem;color:var(--ink3);font-weight:600}
.bits{display:flex;flex-wrap:wrap;gap:3px 9px;justify-content:center}
.bits>span{position:relative}
.bits>span+span::before{content:"·";position:absolute;inset-inline-end:100%;
  margin-inline-end:4px;opacity:.6}
.cnode.now{background:var(--emerald-soft);border-color:var(--emerald)}
.cnode.now b{color:var(--emerald)}
.carrow{display:flex;align-items:center;color:var(--ink3);font-size:1.1rem}
.joint{display:flex;flex-direction:column;gap:9px}
.joint .verse{border-inline-start:3px solid var(--emerald)}
.slink{display:flex;flex-wrap:wrap;gap:6px}

/* settings */
.setrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .lbl{flex:1;min-width:0}
.setrow .lbl b{display:block;font-size:.92rem}
.setrow .lbl small{color:var(--ink3);font-size:.76rem;line-height:1.5;display:block;margin-top:2px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:7px;padding:7px 11px;font-size:.8rem;font-weight:600;
  color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--emerald);color:var(--on-emerald)}
.swatches{display:flex;gap:5px;margin-top:8px}
.sw{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:.64rem;font-weight:700;color:var(--card)}
.gear{background:none;border:0;padding:7px;color:var(--ink2);display:flex;border-radius:9px;flex:none}
.gear svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.gear:hover{background:var(--card2)}

/* filler rows */
.fills{display:flex;flex-direction:column;gap:10px}
.fill{display:flex;flex-direction:column;gap:8px;padding:10px 11px;border-radius:11px;
  background:var(--card2);border:1px solid var(--line);border-inline-start:3px solid var(--line2)}
.fill-w{display:flex;align-items:center;gap:9px}
.fill .w{font-family:var(--quran);font-size:1.3rem;line-height:2}
.fill .pg{background:var(--card);border-inline-start-width:1px}
.fill.c1{border-inline-start-color:var(--m1)}.fill.c1 .w{color:var(--m1)}
.fill.c2{border-inline-start-color:var(--m2)}.fill.c2 .w{color:var(--m2)}
.fill.c3{border-inline-start-color:var(--m3)}.fill.c3 .w{color:var(--m3)}
.fill.c4{border-inline-start-color:var(--m4)}.fill.c4 .w{color:var(--m4)}
.fill.c5{border-inline-start-color:var(--m5)}.fill.c5 .w{color:var(--m5)}
.fill.c6{border-inline-start-color:var(--m6)}.fill.c6 .w{color:var(--m6)}

/* hint + note */
.hint{display:flex;gap:9px;background:var(--emerald-soft);border-radius:11px;padding:11px 13px;
  font-size:.84rem;color:var(--ink);line-height:1.65}
.hint b{color:var(--emerald)}
.note label{display:block;font-size:.75rem;font-weight:700;color:var(--ink3);margin-bottom:6px}
.note textarea{width:100%;min-height:62px;resize:vertical;background:var(--card2);color:var(--ink);
  border:1px solid var(--line2);border-radius:11px;padding:10px 12px;font:inherit;font-size:.88rem}
.note textarea::placeholder{color:var(--ink3)}
.saved{font-size:.72rem;color:var(--ok);font-weight:700;opacity:0;transition:opacity .2s}
.saved.on{opacity:1}

/* chips / filters */
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line2);background:var(--card);border-radius:999px;
  padding:7px 13px;font-size:.8rem;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip b{font-variant-numeric:tabular-nums;opacity:.65;font-weight:700;margin-inline-start:4px}

/* search */
.search{display:flex;gap:9px;align-items:center;background:var(--card);border:1px solid var(--line2);
  border-radius:12px;padding:11px 13px}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:1rem;color:var(--ink)}
.search input:focus{outline:none}
.search svg{width:19px;height:19px;stroke:var(--ink3);fill:none;stroke-width:1.8}
mark{background:var(--m1b);color:var(--m1);border-radius:4px;padding:0 3px}

/* empty / loading */
.muted{color:var(--ink3);font-size:.86rem}
.empty{text-align:center;padding:34px 16px;color:var(--ink3);font-size:.9rem;line-height:1.8}
.empty b{display:block;color:var(--ink2);font-size:1rem;margin-bottom:5px}
.skel{height:76px;border-radius:var(--r);background:linear-gradient(90deg,var(--card),var(--card2),var(--card));
  background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

/* ---- sheets (drill + scope) ---- */
.sheet{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet[hidden]{display:none}
.simbox{margin-top:12px;border-top:1px solid var(--line);padding-top:11px}
.simbox>summary{cursor:pointer;list-style:none;font-size:.82rem;font-weight:700;color:var(--emerald)}
.simbox>summary::-webkit-details-marker{display:none}
.simbox .awhere{padding:12px 0 0}
.memopick{display:flex;flex-direction:column;gap:10px;margin:0 0 18px}
.pickbox{border:1px solid var(--line);border-radius:11px;background:var(--card);overflow:hidden}
.pickbox>summary{cursor:pointer;list-style:none;padding:11px 13px;font-size:.85rem;font-weight:700}
.pickbox>summary::-webkit-details-marker{display:none}
.pickbox .slist{max-height:300px;overflow-y:auto;padding:0 10px 10px}
.rangerow{display:flex;gap:7px;flex-wrap:wrap}
.rangerow select,.rangerow input{flex:1 1 84px;min-width:0;background:var(--card2);color:var(--ink);
  border:1px solid var(--line2);border-radius:10px;padding:9px 10px;font:inherit;font-size:.84rem}
.rangerow select{flex:2 1 140px}
.rangerow input[aria-invalid="true"]{border-color:var(--no)}
.rangerow .btn{flex:none;padding:9px 15px;font-size:.84rem}
.rmx{background:none;border:0;padding:0 3px;color:inherit;font-size:1.05rem;line-height:1}
.outnote{background:var(--makki-bg);color:var(--makki);border-radius:9px;padding:8px 11px;
  font-size:.78rem;font-weight:600;line-height:1.6}
#drillCount{font-size:.76rem;font-weight:700;color:var(--ink3);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.qbtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.qbtns .btn{flex:0 0 auto;padding:8px 13px;font-size:.82rem}
.bk{width:100%;min-height:92px;resize:vertical;background:var(--card2);color:var(--ink);
  border:1px solid var(--line2);border-radius:11px;padding:9px 11px;font:inherit;font-size:.76rem;
  direction:ltr;text-align:left;word-break:break-all}
.sheet-top{background:var(--card);border-bottom:1px solid var(--line)}
.sheet-top .wrap{display:flex;align-items:center;gap:12px;padding-block:11px;min-height:54px}
.sheet-top .x{background:none;border:0;padding:6px;margin-inline-start:auto;color:var(--ink2);
  display:flex;border-radius:8px}
.sheet-top .x svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.sheet-title{font-weight:700;font-size:.95rem}
.bar{height:4px;background:var(--line);border-radius:999px;overflow:hidden;flex:1;max-width:160px}
.bar i{display:block;height:100%;background:var(--emerald);border-radius:999px;transition:width .3s}
.sheet-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-block:18px 22px}
.sheet-foot{background:var(--card);border-top:1px solid var(--line)}
.sheet-foot .wrap{padding-block:12px}

/* quiz */
.q{display:flex;flex-direction:column;gap:16px}
.q-ask{font-size:.95rem;font-weight:600;color:var(--ink2);line-height:1.7}
.q-ask b{color:var(--emerald)}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:right;background:var(--card);border:1.5px solid var(--line2);border-radius:12px;
  padding:13px 15px;display:flex;align-items:center;gap:10px;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--emerald)}
.opt .ow{font-family:var(--quran);font-size:1.22rem;line-height:1.9}
.opt .on{font-size:.95rem;font-weight:600}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.opt{flex-wrap:wrap}
.selfrate{margin-top:15px;border-top:1px solid var(--line);padding-top:14px}
.opt.rate{justify-content:center;font-weight:700;font-size:.92rem}
.opt.rate.r-easy{border-color:var(--ok)}
.opt.rate.r-hmm{border-color:var(--gold)}
.opt.rate.r-hard{border-color:var(--no)}
.opt.rate.picked.r-easy{background:var(--ok-bg);color:var(--ok)}
.opt.rate.picked.r-hmm{background:var(--makki-bg);color:var(--makki)}
.opt.rate.picked.r-hard{background:var(--no-bg);color:var(--no)}
.opt .osub{flex-basis:100%;font-size:.72rem;font-weight:600;color:var(--ink3);margin-top:3px}
.opt .mk{margin-inline-start:auto;font-size:.76rem;font-weight:700}
.opt.right .mk{color:var(--ok)} .opt.wrong .mk{color:var(--no)}
.verdict{display:flex;align-items:center;gap:9px;font-weight:700;font-size:.92rem;padding:11px 13px;
  border-radius:11px}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.no{background:var(--no-bg);color:var(--no)}
/* tap-the-difference */
.tapline{font-family:var(--quran);font-size:1.22rem;line-height:2.6;display:flex;flex-wrap:wrap;
  gap:2px 0;align-items:baseline}
.tw{background:none;border:0;padding:1px 5px;border-radius:7px;font:inherit;line-height:inherit;
  border:1.5px solid transparent}
.tw:hover{background:var(--card2)}
.tw[aria-pressed="true"]{background:var(--m1b);color:var(--m1);border-color:var(--m1)}
.tw.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.tw.miss{border-color:var(--no);border-style:dashed;color:var(--no)}
.tw.bad{background:var(--no-bg);color:var(--no);border-color:var(--no);text-decoration:line-through}

/* scope sheet */
.grid30{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.gbtn{background:var(--card);border:1px solid var(--line2);border-radius:11px;padding:11px 6px;
  text-align:center;font-weight:600;font-size:.84rem;display:flex;flex-direction:column;gap:2px}
.gbtn small{font-size:.68rem;color:var(--ink3);font-variant-numeric:tabular-nums}
.gbtn[aria-pressed="true"]{background:var(--emerald-soft);border-color:var(--emerald);color:var(--emerald)}
.gbtn[aria-pressed="true"] small{color:var(--emerald)}
.slist{display:flex;flex-direction:column;gap:6px}
.sitem{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:10px 13px;text-align:right;font-size:.9rem;font-weight:600}
.sitem small{margin-inline-start:auto;color:var(--ink3);font-size:.72rem;font-weight:600;
  font-variant-numeric:tabular-nums}
.sitem[aria-pressed="true"]{border-color:var(--emerald);background:var(--emerald-soft);color:var(--emerald)}
.sum-end{text-align:center;display:flex;flex-direction:column;gap:18px;padding-top:22px}
.ring{font-size:3rem;font-weight:700;color:var(--emerald);font-variant-numeric:tabular-nums}
/* ---- وِردي: رسالة، مهام، أذكار ---- */
.msg{background:var(--card);border:1px solid var(--emerald);border-radius:18px;padding:18px 17px;
  display:flex;flex-direction:column;gap:13px}
.msg .mk{font-size:.73rem;font-weight:700;letter-spacing:.04em;color:var(--emerald)}
.msg .mtxt{font-family:var(--quran);font-size:1.3rem;line-height:2.6;color:var(--ink)}
.msg .mref{font-size:.78rem;font-weight:700;color:var(--ink2);display:flex;flex-wrap:wrap;
  gap:7px;align-items:center}
.tk{display:flex;gap:11px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}
.tk:first-child{border-top:0;padding-top:2px}
.tk .bx{flex:none;width:25px;height:25px;border-radius:8px;border:1.8px solid var(--line2);
  background:var(--card2);display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;margin-top:1px}
.tk .bx svg{width:14px;height:14px;stroke:var(--card);fill:none;stroke-width:3;
  stroke-linecap:round;stroke-linejoin:round;opacity:0}
.tk.on .bx{background:var(--emerald);border-color:var(--emerald)}
.tk.on .bx svg{opacity:1}
.tk .tb{flex:1;min-width:0}
.tk .tb b{font-size:.95rem;display:block;line-height:1.6}
.tk.on .tb b{text-decoration:line-through;color:var(--ink3)}
.tk .tb small{display:block;font-size:.77rem;color:var(--ink3);margin-top:3px;line-height:1.75}
.tk .tgo{flex:none;padding:7px 12px;font-size:.8rem;margin-top:1px}
.prog{height:7px;border-radius:999px;background:var(--line);overflow:hidden;margin:11px 0 9px}
.prog i{display:block;height:100%;background:var(--emerald);border-radius:999px;transition:width .25s}
.dgrp{border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.dgrp>summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;gap:9px;
  align-items:center;font-weight:700;font-size:.95rem}
.dgrp>summary::-webkit-details-marker{display:none}
.dgrp[open]>summary{border-bottom:1px solid var(--line);background:var(--card2)}
.dgrp>summary small{margin-inline-start:auto;font-size:.74rem;color:var(--ink3);font-weight:600}
.dgrp .ghint{padding:11px 15px;font-size:.78rem;color:var(--ink3);line-height:1.8;
  border-bottom:1px solid var(--line);background:var(--card2)}
.dh{padding:13px 15px;border-top:1px solid var(--line);display:flex;gap:11px;align-items:flex-start}
.dh:first-child{border-top:0}
.dh .dtx{flex:1;min-width:0}
.dh .zk{font-family:var(--quran);font-size:1.1rem;line-height:2.3;color:var(--ink)}
.dh .zk+.zk{margin-top:4px}
.dh .zs{display:block;font-size:.74rem;color:var(--ink3);font-weight:600;margin-top:6px;line-height:1.7}
.cnt{flex:none;min-width:60px;border:1.6px solid var(--line2);background:var(--card2);color:var(--ink);
  border-radius:12px;padding:9px 8px 8px;font:inherit;font-weight:700;cursor:pointer;text-align:center;
  display:flex;flex-direction:column;gap:2px;line-height:1.15}
.cnt b{font-size:1.05rem;font-variant-numeric:tabular-nums}
.cnt small{font-size:.63rem;color:var(--ink3);font-weight:600}
.cnt.done{background:var(--emerald-soft);border-color:var(--emerald);color:var(--emerald)}
.cnt.done small{color:var(--emerald)}
.srcnote{font-size:.77rem;color:var(--ink3);line-height:1.85;background:var(--card2);
  border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.wfld{width:100%;background:var(--card2);color:var(--ink);border:1px solid var(--line2);
  border-radius:10px;padding:10px 12px;font:inherit;font-size:.92rem;resize:vertical}
.wfld::placeholder{color:var(--ink3)}
.dhx{flex:none;background:none;border:0;color:var(--ink3);cursor:pointer;padding:4px;
  font:inherit;font-size:.75rem;font-weight:700}
/* ---- تشيك ليست الحفظ ---- */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:7px;padding:12px}
.cbtn{border:1.5px solid var(--line2);background:var(--card2);color:var(--ink);border-radius:10px;
  padding:8px 6px;font:inherit;font-size:.78rem;font-weight:700;cursor:pointer;display:flex;
  flex-direction:column;gap:2px;align-items:center;line-height:1.35;text-align:center}
.cbtn small{font-size:.66rem;font-weight:600;color:var(--ink3)}
.cbtn.s1{background:var(--m1b);border-color:var(--m1);color:var(--m1)}
.cbtn.s1 small{color:var(--m1)}
.cbtn.s2{background:var(--emerald-soft);border-color:var(--emerald);color:var(--emerald)}
.cbtn.s2 small{color:var(--emerald)}
.cbtn.s3{background:var(--no-bg);border-color:var(--no);color:var(--no)}
.cbtn.s3 small{color:var(--no)}
.chklist{max-height:330px;overflow-y:auto;padding:4px 12px 12px}
.srow{display:flex;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.snm{flex:1;min-width:0;text-align:start;background:none;border:0;color:var(--ink);font:inherit;
  font-size:.88rem;font-weight:600;cursor:pointer;padding:5px 2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.srow .cbtn{flex:none;min-width:104px;padding:6px 8px;flex-direction:row;gap:0}
.chklist[data-f="0"] .srow:not([data-st="0"]),
.chklist[data-f="1"] .srow:not([data-st="1"]),
.chklist[data-f="2"] .srow:not([data-st="2"]),
.chklist[data-f="3"] .srow:not([data-st="3"]){display:none}
.chkhint{font-size:.78rem;color:var(--ink3);line-height:1.8;padding:11px 13px 0}
[hidden]{display:none !important}
.needbox{border:1px solid var(--no);background:var(--no-bg);border-radius:12px;padding:12px 13px;
  display:flex;flex-direction:column;gap:9px}
.needbox b{color:var(--no);font-size:.88rem}
/* ---- جلسة الحفظ الجديد ---- */
.lstage{font-size:.76rem;font-weight:700;letter-spacing:.04em;color:var(--emerald)}
.ltitle{font-size:1.1rem;font-weight:700;margin:5px 0 3px;line-height:1.5}
.lhow{font-size:.84rem;color:var(--ink3);line-height:1.85;margin-bottom:14px}
.lbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 16px;margin-bottom:14px}
.lbox+.lbox{margin-top:-4px}
.hintw{display:inline-block;background:var(--card2);border:1px solid var(--line);
  border-radius:7px;padding:2px 9px;margin:3px 2px;font-family:var(--quran);
  font-size:1.1rem;line-height:1.9}
.bw{display:inline-block;width:38px;height:1.05em;margin:5px 3px;
  border-bottom:2px dashed var(--line2);vertical-align:middle}
.lreps{display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0 10px}
.ldot{width:13px;height:13px;border-radius:50%;border:2px solid var(--line2);background:var(--card2)}
.ldot.on{background:var(--emerald);border-color:var(--emerald)}
.lnum{font-size:.8rem;font-weight:700;color:var(--ink3);margin-inline-start:7px;
  font-variant-numeric:tabular-nums}
.ldone{text-align:center;padding:18px 6px}
.ldone .big{font-size:1.3rem;font-weight:700;margin-bottom:8px}
.planrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.planrow select{flex:1 1 150px;min-width:0;background:var(--card2);color:var(--ink);
  border:1px solid var(--line2);border-radius:10px;padding:10px 11px;font:inherit;font-size:.9rem}
.wirdbig{background:var(--card);border:1px solid var(--emerald);border-radius:18px;
  padding:18px 17px;margin-bottom:16px;display:flex;flex-direction:column;gap:11px}
.wirdbig .wk{font-size:.74rem;font-weight:700;letter-spacing:.04em;color:var(--emerald)}

  font-size:.85rem;font-weight:700;text-align:center}
/* ---- شريط التابات بستة أزرار ---- */
.tabs button{font-size:.66rem;padding:8px 1px 7px;gap:2px}
.tabs button svg{width:20px;height:20px}
.topbtn{background:var(--card2);border:1px solid var(--line);border-radius:10px;

  stroke-linecap:round;stroke-linejoin:round}
/* ---- صحوة ---- */

  background:var(--emerald-soft);color:var(--emerald);font-size:.78rem;
  display:inline-flex;align-items:center;justify-content:center}

  border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-top:16px}
/* ---- الصوت ---- */
.audrow{display:flex;gap:7px;flex-wrap:wrap;margin:-4px 0 14px}
.abtn{display:inline-flex;align-items:center;gap:6px;background:var(--card2);color:var(--ink);
  border:1px solid var(--line2);border-radius:10px;padding:8px 12px;font:inherit;font-size:.8rem;
  font-weight:700;cursor:pointer}

@keyframes pulse{50%{opacity:.25}}

.audmsg.bad{color:var(--no)}
/* ---- زرار تشغيل صغير جنب الآية ---- */

  color:var(--emerald);border:0;border-radius:8px;padding:3px 9px;font:inherit;font-size:.72rem;
  font-weight:700;cursor:pointer;vertical-align:middle;margin-inline-start:7px}

/* ---- تاب صوتي ---- */

  font-family:var(--quran);font-size:1.15rem;line-height:2.3;margin-bottom:12px}
.vlist{display:flex;flex-direction:column;gap:9px}

  color:var(--emerald)}

/* ---- رسالة بتطلع في أي شاشة ---- */
.toast{position:fixed;inset-inline:14px;bottom:calc(70px + env(safe-area-inset-bottom,0px));
  z-index:70;background:var(--ink);color:#fff;border-radius:13px;padding:12px 15px;

  box-shadow:0 6px 22px rgba(10,25,18,.22)}
.toast.bad{background:var(--no)}
</style>

<script>
"use strict";
/* ------------------------------------------------------------------ helpers */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const AD = "٠١٢٣٤٥٦٧٨٩";
const ar = n => String(n).replace(/\d/g,d=>AD[+d]);
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DAY = 864e5;
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const times = n => n===1 ? "مرة واحدة" : n===2 ? "مرتين" : ar(n)+(n<=10?" مرات":" مرة");
const cmpKey = (a,b)=>{const[x,y]=a.split(":").map(Number),[p,q]=b.split(":").map(Number);return x-p||y-q;};

const DIAC = new RegExp("[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]","g");
const RX = {
  alef:  new RegExp("[\u0671\u0622\u0623\u0625]","g"),
  hamza: new RegExp("[\u0621\u0654\u0655]","g"),
  ya:    new RegExp("[\u0649\u06CC\u0626]","g"),
  waw:   new RegExp("\u0624","g"),
  other: new RegExp("[^\u0621-\u064A ]","g")
};

function norm(s){
  s = s.normalize("NFC").replace(DIAC,"")
       .replace(RX.alef,"ا").replace(RX.hamza,"")
       .replace(RX.ya,"ي").replace(RX.waw,"و")
       .replace(RX.other," ");
  return s.replace(/\s+/g," ").trim();
}

/* ------------------------------------------------------------------ state */
const LS = "mutashabihat.v1";
let S = { cards:{}, notes:{}, scope:{k:"all"}, day:{d:"",n:0}, streak:0, lastDay:"",
          theme:"auto", cb:false, surah:0, juz:0,
          memo:{all:true}, newPerDay:10, v:1,
          wird:0, dh:{d:"",c:{}}, wd:{d:"",done:{},streak:0,full:""}, myDh:[],
          chk:{s:{},j:{}}, plan:null };
function applyPrefs(){
  const r=document.documentElement;
  if(S.theme==="light"||S.theme==="dark") r.setAttribute("data-app",S.theme);
  else r.removeAttribute("data-app");
  if(S.cb) r.setAttribute("data-cb","1"); else r.removeAttribute("data-cb");
}
function loadLocal(){
  try{ const r = localStorage.getItem(LS); if(r) S = Object.assign(S, JSON.parse(r)); }catch(e){}
}
let saveT=0;
function save(){
  try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){}
  if(cloud){ clearTimeout(saveT); saveT = setTimeout(pushCloud, 1500); }
}
let cloud=null, cloudDoc=null;
async function initCloud(){
  try{
    const u = await window.claude?.use?.("user");
    const d = await window.claude?.use?.("db");
    if(!u || !d) return;
    const id = await u.id();
    if(!id) return;
    cloudDoc = d.doc("data/users/"+id+"/progress");
    const snap = await cloudDoc.get();
    if(snap && snap.exists){ mergeCloud(snap.data()); render(); }
    cloud = d;
  }catch(e){}
}
function mergeCloud(r){
  if(!r || typeof r!=="object") return;
  for(const [k,v] of Object.entries(r.cards||{})){
    const mine = S.cards[k];
    if(!mine || (v.t||0) > (mine.t||0)) S.cards[k]=v;
  }
  for(const [k,v] of Object.entries(r.notes||{})) if(!S.notes[k]) S.notes[k]=v;
  if((r.streak||0) > S.streak) S.streak = r.streak;
  try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){}
}
async function pushCloud(){
  if(!cloudDoc) return;
  try{ await cloudDoc.set({cards:S.cards, notes:S.notes, streak:S.streak, at:Date.now()}); }catch(e){}
}

/* ------------------------------------------------------------------ data */
let D=null, CASES=[], SU={}, ST={}, tokCache=new Map(), verseIdx=new Map();
const TYPE_AR = {identical:"متطابقة", similar:"متشابهة", frame:"متشابهة"};
/* المستخدم بيشوف نوعين بس: متطابقة ومتشابهة */
const grp = c => c.t==="identical" ? "identical" : "similar";
const TYPES = ["similar","identical"];
const places = n => n===1 ? "موضع واحد" : n===2 ? "موضعين"
                  : ar(n)+(n<=10?" مواضع":" موضع");
let SC={}, OPEN={}, LINKS={}, LINKNOTE="", JUZR={}, QTR=[];

function toks(k){
  let t = tokCache.get(k);
  if(!t){ t = D.verses[k][0].map(norm); tokCache.set(k,t); }
  return t;
}
const sname = k => SU[+k.split(":")[0]];
const ayno  = k => +k.split(":")[1];
const juzOf = k => D.verses[k][1];
const refAr = k => sname(k)+" "+ar(ayno(k));

async function boot(){
  loadLocal();
  S.surah = 0; S.juz = 0;
  audWarmAll();   /* تاب حفظ يفتح من أوله كل مرة، مش جوّه آخر سورة */
  applyPrefs();
  renderSkeleton();
  if(window.__QURAN_DATA__){ D = window.__QURAN_DATA__; }   // single-file build
  else {
    try{ const r = await fetch("data.json"); if(!r.ok) throw 0; D = await r.json(); }
    catch(e){ $("#v-today").innerHTML =
      '<div class="empty"><b>تعذّر تحميل نص المصحف</b>جرّبي تحديث الصفحة.</div>'; return; }
  }
  D.surahs.forEach(s=>{ SU[s.n]=s.name; ST[s.n]=s.type; SC[s.n]=s.count; });

  /* ids are derived from the verses themselves, so progress stays attached to
     the right spot even if the data file is rebuilt in a different order */
  const used=new Set(), oldMap={};
  const mk = base => { let id=base, n=2; while(used.has(id)) id=base+"~"+(n++); used.add(id); return id; };
  D.identical.forEach((g,i)=>{ const id=mk("i:"+g[0]); oldMap["i"+i]=id;
                               CASES.push({id,t:"identical",v:g}); });
  D.similar.forEach((g,i)=>{ const id=mk("s:"+g[0]); oldMap["s"+i]=id;
                             CASES.push({id,t:"similar",v:g}); });
  D.frames.forEach((f,i)=>{
    const occ=Object.values(f.fill).flat().sort((a,b)=>cmpKey(a[0],b[0])||a[1]-b[1]);
    const v=[...new Set(occ.map(o=>o[0]))].sort(cmpKey);
    const id=mk("f:"+occ[0][0]+"."+occ[0][1]+"."+f.j+"."+f.n);
    oldMap["f"+i]=id;
    CASES.push({id,t:"frame",v,f});
  });
  migrateIds(oldMap);
  buildOpenings();
  buildJuz();
  CASES.forEach((c,i)=>{
    c.i=i; c.j=[...new Set(c.v.map(juzOf))]; c.s=[...new Set(c.v.map(k=>+k.split(":")[0]))];
    c.v.forEach(k=>{ let a=verseIdx.get(k); if(!a) verseIdx.set(k,a=[]); a.push(i); });
  });
  rollDay();
  initCloud();
  render();
}

/* ------------------------------------------------------------------ scope + scheduling */
function inScope(c){
  const s=S.scope;
  if(s.k==="all") return true;
  if(s.k==="juz") return c.j.includes(s.n);
  if(s.k==="surah") return c.s.includes(s.n);
  return true;
}
function scopeLabel(){
  const s=S.scope;
  if(s.k==="juz") return "الجزء "+ar(s.n);
  if(s.k==="surah") return "سورة "+SU[s.n];
  return "كل المصحف";
}
const INT=[0,1,2,5,12,30];
const card = id => S.cards[id] || null;
/* local calendar day, not UTC */
function localDay(ts){
  const d = ts ? new Date(ts) : new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
/* what the user says they have memorised; the daily queue is drawn from here */
function memoEmpty(){
  const m=S.memo||{all:true};
  return !m.all && !(m.juz||[]).length && !(m.sur||[]).length && !(m.ranges||[]).length;
}
function verseInMemo(k){
  const m=S.memo||{all:true};
  if(m.all) return true;
  const s=+k.split(":")[0], a=+k.split(":")[1];
  if((m.juz||[]).includes(juzOf(k))) return true;
  if((m.sur||[]).includes(s)) return true;
  return (m.ranges||[]).some(r=>r.s===s && a>=r.a && a<=r.b);
}
function inMemo(c){
  if(memoEmpty()) return true;
  return c.v.some(verseInMemo);
}
/* how the scope reads to the user */
function memoLabel(){
  const m=S.memo||{all:true};
  if(m.all || memoEmpty()) return "كل المصحف";
  const bits=[];
  if((m.juz||[]).length) bits.push(ar(m.juz.length)+(m.juz.length===1?" جزء":" أجزاء"));
  if((m.sur||[]).length) bits.push(ar(m.sur.length)+(m.sur.length===1?" سورة":" سور"));
  if((m.ranges||[]).length) bits.push(ar(m.ranges.length)+" نطاق آيات");
  return bits.join(" + ");
}
const STATE_AR = b => b<=0 ? "جديد" : b===1 ? "محتاج تثبيت" : b<=3 ? "قيد المراجعة" : "ثابت";
function nextDue(st){
  if(!st || !st.d) return "";
  const days = Math.round((st.d-Date.now())/DAY);
  if(days<=0) return "مستحق دلوقتي";
  if(days===1) return "المراجعة الجاية بكرة";
  return "المراجعة الجاية بعد "+ar(days)+" يوم";
}
/* A level only goes up on a first-try correct answer, on a card that was
   actually due (or new), and at most once per calendar day. Free practice
   and "right after seeing the answer" never promote and never postpone. */
function grade(c, ok, daily){
  const had = card(c.id);
  const cur = had || {b:0,r:0,w:0,d:0,d0:""};
  const today = localDay();
  const wasDue = !had || cur.d<=Date.now();
  const st = {b:cur.b||0, d:cur.d||0, t:Date.now(), d0:cur.d0||"",
              r:(cur.r||0)+(ok?1:0), w:(cur.w||0)+(ok?0:1)};
  if(!ok){
    st.b = 1; st.d = Date.now(); st.d0 = today;      // comes back in this session
  } else if(daily && wasDue && cur.d0 !== today){
    if(!had && c.t!=="ayah") S.day.nw = (S.day.nw||0)+1;   // a new spot entered today
    st.b = Math.min(st.b+1, 5);
    st.d = Date.now() + INT[st.b]*DAY;
    st.d0 = today;
  } else if(daily && wasDue){
    st.d = Date.now() + INT[Math.max(st.b,1)]*DAY;   // already answered today: no extra level
  }
  S.cards[c.id] = st;
  save();
}
/* self-rated grading: the user judges, the app only schedules */
function gradeSelf(c, r, daily){
  if(r==="hard") return grade(c,false,daily);
  if(r==="easy") return grade(c,true,daily);
  const cur = card(c.id) || {b:0,r:0,w:0,d:0,d0:""};
  S.cards[c.id] = {b:Math.max(cur.b||0,1), d:Date.now()+DAY, t:Date.now(), d0:localDay(),
                   r:cur.r||0, w:cur.w||0};
  save();
}
/* ayah-level practice (تسميع): drawn from what the user says she memorised */
function memoVerses(){
  if(memoEmpty() || (S.memo&&S.memo.all)) return ALLK;
  return ALLK.filter(verseInMemo);
}
function recitationQueue(n){
  const pool = memoVerses();
  if(!pool.length) return [];
  const due = pool.filter(k=>{const s=card("a:"+k); return s && s.d<=Date.now();});
  const fresh = pool.filter(k=>!card("a:"+k));
  const pick = [...shuffle(due.slice()).slice(0,n)];
  if(pick.length<n) pick.push(...shuffle(fresh.slice()).slice(0, n-pick.length));
  return pick.slice(0,n).map(k=>({id:"a:"+k, t:"ayah", v:[k],
                                  j:[juzOf(k)], s:[+k.split(":")[0]]}));
}
/* the exact set of questions today's session will ask */
function dailyQueue(){
  const due = dueCases();
  const allow = Math.max(0, (S.newPerDay==null?10:S.newPerDay) - (S.day.nw||0));
  const nw = newCases().slice(0, allow);
  return [...due, ...nw].slice(0, 30);
}
function dueCases(){
  const now=Date.now();
  return CASES.filter(c=>{const s=card(c.id); return s && s.d<=now && inScope(c) && inMemo(c);});
}
function newCases(){ return CASES.filter(c=>!card(c.id) && inScope(c) && inMemo(c)); }
function learned(){ return CASES.filter(c=>{const s=card(c.id); return s && s.b>=4 && inScope(c);}).length; }
function shakyCases(){
  return CASES.filter(c=>{const s=card(c.id); return s && (s.w||0)>=2 && (s.w||0)>=(s.r||0);});
}
/* one-time move from the old position-based ids to the content-based ones */
function migrateIds(map){
  if(S.v>=2) return;
  const cards={}, notes={};
  for(const k in S.cards) cards[map[k]||k]=S.cards[k];
  for(const k in S.notes) notes[map[k]||k]=S.notes[k];
  S.cards=cards; S.notes=notes; S.v=2; save();
}
function rollDay(){
  const t = localDay();
  if(S.day.d!==t){
    const y = localDay(Date.now()-DAY);
    if(S.day.n>0) S.streak = (S.day.d===y) ? (S.streak||0)+1 : 1;
    else if(S.day.d && S.day.d!==y) S.streak = 0;
    S.day = {d:t, n:0};
    save();
  }
}

/* ------------------------------------------------------------------ diffs */
function lcsTable(a,b){
  const n=a.length,m=b.length,dp=[];
  for(let i=0;i<=n;i++) dp.push(new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    dp[i][j] = a[i]===b[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
  return dp;
}
/* differing runs as [startA,endA,startB,endB] */
function diffOps(a,b){
  const n=a.length,m=b.length,dp=lcsTable(a,b),ops=[];
  let i=0,j=0;
  while(i<n||j<m){
    if(i<n&&j<m&&a[i]===b[j]){i++;j++;continue;}
    const si=i,sj=j;
    while(i<n||j<m){
      if(i<n&&j<m&&a[i]===b[j]) break;
      if(j>=m) i++;
      else if(i>=n) j++;
      else if(dp[i+1][j]>=dp[i][j+1]) i++;
      else j++;
    }
    ops.push([si,i,sj,j]);
  }
  return ops;
}
function diffIdx(a,b){
  const A=new Set(),B=new Set();
  for(const [si,ei,sj,ej] of diffOps(a,b)){
    for(let x=si;x<ei;x++) A.add(x);
    for(let x=sj;x<ej;x++) B.add(x);
  }
  return [A,B];
}
/* ---- letter level: split a word into letter clusters (letter + its marks) ---- */
function clusters(word){
  const out=[];
  for(const ch of word){
    const b=norm(ch);
    if(b || !out.length) out.push({t:ch,b});
    else out[out.length-1].t += ch;
  }
  return out;
}
/* for words that sit in the same slot: which letters each one does NOT share with the rest */
function letterMarks(words){
  const cl = words.map(clusters);
  const bases = cl.map(c=>c.filter(x=>x.b).map(x=>x.b));
  let core = bases[0] || [];
  for(let i=1;i<bases.length;i++){
    const dp=lcsTable(core,bases[i]), nx=[];
    let x=0,y=0;
    while(x<core.length&&y<bases[i].length){
      if(core[x]===bases[i][y]){nx.push(core[x]);x++;y++;}
      else if(dp[x+1][y]>=dp[x][y+1]) x++; else y++;
    }
    core=nx;
  }
  return cl.map(cs=>{
    const marks=new Set(); let p=0, letters=0;
    cs.forEach((x,idx)=>{
      if(!x.b) return;
      letters++;
      if(p<core.length && x.b===core[p]) p++; else marks.add(idx);
    });
    return (marks.size && marks.size<letters) ? marks : null;
  });
}
function wordHTML(word, lset){
  if(!lset) return esc(word);
  return clusters(word).map((x,i)=> lset.has(i)
      ? '<u class="lt">'+esc(x.t)+"</u>" : esc(x.t)).join("");
}
/* marks for every member of a similar family, aligned against the longest one */
function familyMarks(keys){
  const ref = keys.reduce((a,b)=> toks(b).length>toks(a).length ? b : a, keys[0]);
  const marks={}, letters={};
  keys.forEach(k=>{ marks[k]=new Set(); letters[k]={}; });
  const put=(k,i,set)=>{ if(!set) return;
    letters[k][i] = letters[k][i] ? new Set([...letters[k][i],...set]) : set; };
  for(const k of keys){
    if(k===ref) continue;
    const ta=D.verses[ref][0], tb=D.verses[k][0];
    for(const [si,ei,sj,ej] of diffOps(toks(ref),toks(k))){
      for(let x=si;x<ei;x++) marks[ref].add(x);
      for(let x=sj;x<ej;x++) marks[k].add(x);
      if(ei-si===1 && ej-sj===1){
        const lm = letterMarks([ta[si], tb[sj]]);
        put(ref,si,lm[0]); put(k,sj,lm[1]);
      }
    }
  }
  return {marks, letters};
}
function ayahHTML(k, marks, cls, letters){
  const w = D.verses[k][0];
  return w.map((x,i)=> marks && marks.has(i)
      ? '<b class="hl'+(cls?" "+cls:"")+'">'+wordHTML(x, letters && letters[i])+"</b>"
      : esc(x)).join(" ");
}

/* ------------------------------------------------------------------ rendering: cases */
const revAr = s => ST[s]==="makki" ? "مكية" : "مدنية";
const juzStr = keys => {
  const js=[...new Set(keys.map(juzOf))].sort((a,b)=>a-b);
  return js.length>1 ? "الأجزاء "+js.map(ar).join("، ") : "الجزء "+ar(js[0]);
};
function verseBlock(k, marks, cls, letters){
  const s=+k.split(":")[0];
  return '<div class="verse">'
    + '<div class="ref">'+esc(refAr(k))
    + '<span class="juz">الجزء '+ar(juzOf(k))+"</span>"
    + '<span class="rev '+(ST[s]==="makki"?"makki":"madani")+'">'+revAr(s)+"</span></div>"
    + '<div class="ayah sm">'+ayahHTML(k,marks,cls,letters)+"</div></div>";
}
/* places grouped by surah, each with its juz and whether it is makki or madani */
function placesHTML(keys, fixedCls){
  const groups=[];
  for(const k of keys){
    const s=+k.split(":")[0], g=groups[groups.length-1];
    if(g && g.s===s) g.a.push(k); else groups.push({s,a:[k]});
  }
  return '<div class="pgroups">'+groups.map((g,n)=>{
    const js=[...new Set(g.a.map(juzOf))].sort((x,y)=>x-y);
    return '<div class="pg '+(fixedCls||("c"+((n%6)+1)))+'">'
      + '<div class="pg-h">'+(fixedCls?"":'<span class="idx">'+ar(n+1)+"</span>")+"<b>"+esc(SU[g.s])+"</b>"
      + '<span class="pg-meta">'+(js.length>1 ? "الأجزاء "+js.map(ar).join("، ") : "الجزء "+ar(js[0]))+"</span>"
      + '<span class="rev '+(ST[g.s]==="makki"?"makki":"madani")+'">'+revAr(g.s)+"</span></div>"
      + '<div class="pg-a">'+g.a.map(k=>'<span class="ano">آية '+ar(ayno(k))+"</span>").join("")+"</div></div>";
  }).join("")+"</div>";
}
/* which word to light up in each verse of a frame, coloured per filler */
function frameMarks(c){
  const out={}, ws=Object.keys(c.f.fill);
  const lm = letterMarks(ws.map(w=>{
    const o=c.f.fill[w][0]; return D.verses[o[0]][0][o[1]+c.f.j];
  }));
  ws.forEach((w,n)=>{
    for(const [k,i] of c.f.fill[w]){
      if(!out[k]) out[k]={set:new Set(), cls:"c"+((n%6)+1), letters:{}};
      out[k].set.add(i + c.f.j);
      if(lm[n]) out[k].letters[i + c.f.j] = lm[n];
    }
  });
  return {marks:out, letters:lm};
}
function frameFills(c){
  const f=c.f, ws=Object.keys(f.fill), lm=frameMarks(c).letters;
  return ws.map((w,n)=>{
    const occ=f.fill[w], cls="c"+((n%6)+1);
    const disp = D.verses[occ[0][0]][0][occ[0][1]+f.j];
    return '<div class="fill '+cls+'"><div class="fill-w"><span class="idx">'+ar(n+1)+"</span>"
      + '<span class="w">'+wordHTML(disp, lm[n])+"</span></div>"
      + placesHTML(occ.map(o=>o[0]), cls)+"</div>";
  }).join("");
}
function frameLine(c, fillWord){
  const f=c.f, ws=Object.keys(f.fill);
  const n = fillWord ? Math.max(0, ws.indexOf(fillWord)) : 0;
  const first = f.fill[fillWord || ws[0]][0];
  const w = D.verses[first[0]][0].slice(first[1], first[1]+f.n);
  const lm = fillWord ? frameMarks(c).letters : null;
  return w.map((x,i)=> i===f.j
    ? (fillWord ? '<b class="hl c'+((n%6)+1)+'">'+wordHTML(x, lm&&lm[n])+"</b>"
                : '<span class="blank"></span>')
    : esc(x)).join(" ");
}
/* a ضابط the page can work out on its own, where a real rule applies */
function autoHint(c){
  if(c.t!=="frame") return "";
  const f=c.f, ws=Object.keys(f.fill);
  if(ws.length!==2) return "";
  const a={w:ws[0],o:f.fill[ws[0]][0]}, b={w:ws[1],o:f.fill[ws[1]][0]};
  if(a.o[0].split(":")[0]===b.o[0].split(":")[0]) return "";
  const first = cmpKey(a.o[0],b.o[0])<0 ? a : b, second = first===a ? b : a;
  const out=[];
  if(first.w.length !== second.w.length){
    const shortFirst = first.w.length < second.w.length;
    out.push("<b>الأقصر "+(shortFirst?"أولًا":"ثانيًا")+":</b> «"
      + esc(D.verses[first.o[0]][0][first.o[1]+f.j]) + "» في " + esc(sname(first.o[0]))
      + "، و«" + esc(D.verses[second.o[0]][0][second.o[1]+f.j]) + "» في " + esc(sname(second.o[0])) + ".");
  }
  const sa=+a.o[0].split(":")[0], sb=+b.o[0].split(":")[0];
  if(ST[sa]!==ST[sb])
    out.push("<b>مكية ومدنية:</b> «"+esc(D.verses[a.o[0]][0][a.o[1]+f.j])+"» في سورة "+revAr(sa)
      + "، و«"+esc(D.verses[b.o[0]][0][b.o[1]+f.j])+"» في سورة "+revAr(sb)+".");
  for(const x of [a,b]){
    const sn = norm(sname(x.o[0])).replace(/^ال/,"");
    if(sn && x.w[0]===sn[0])
      out.push("<b>حرف مشترك:</b> «"+esc(D.verses[x.o[0]][0][x.o[1]+f.j])+"» مع «"+esc(sname(x.o[0]))+"» بيبدأوا بنفس الحرف.");
  }
  return out.length ? '<div class="hint"><div>'+out.join("<br>")+"</div></div>" : "";
}
/* the verse exactly as written, minus only the waqf/sajda marks we display */
const WAQF = new RegExp("[\\u06D6-\\u06DC\\u06DE-\\u06E8\\u06EA-\\u06ED]","g");
const clean = s => s.normalize("NFC").replace(WAQF,"").replace(/\s+/g," ").trim();
const exactForm = k => clean(D.verses[k][0].join(" "));
const allExact = keys => new Set(keys.map(exactForm)).size===1;
/* same letters, different vowelling: mark the words that differ */
function tashkeelMarks(keys){
  const out={}; keys.forEach(k=>out[k]=new Set());
  const n = D.verses[keys[0]][0].length;
  for(let i=0;i<n;i++){
    const set = new Set(keys.map(k=>clean(D.verses[k][0][i]||"")));
    if(set.size>1) keys.forEach(k=>out[k].add(i));
  }
  return out;
}
/* the verses of a case, in full, with the differing word (and letters) coloured */
function caseVisual(c){
  if(c.t==="ayah" || !c.f && c.t!=="identical" && c.t!=="similar")
    return '<div class="verse pin"><div class="ayah">'+ayahHTML(c.v[0])+"</div></div>";
  if(c.t==="identical"){
    if(allExact(c.v))
      return '<div class="verse pin"><div class="ayah">'+ayahHTML(c.v[0])+"</div></div>"
        + '<div><div class="muted" style="margin:9px 0">وردت <b>'+times(c.v.length)+"</b>:</div>"
        + placesHTML(c.v)+"</div>";
    const m = tashkeelMarks(c.v);
    return '<div class="hint"><div><b>فرق تشكيل بس:</b> الحروف واحدة، والفرق في الضبط — '
      + "غالبًا شدّة إدغام جاية من آخر الآية اللي قبلها، مش اختلاف في الآية نفسها.</div></div>"
      + c.v.map((k,n)=>verseBlock(k, m[k], "c"+((n%6)+1))).join("");
  }
  if(c.t==="similar"){
    const m = familyMarks(c.v);
    return c.v.map((k,n)=>verseBlock(k, m.marks[k], "c"+((n%6)+1), m.letters[k])).join("");
  }
  const mark = frameMarks(c).marks;
  return '<div class="verse pin"><div class="ayah">'+frameLine(c)+"</div></div>"
    + '<div class="fills">'+frameFills(c)+"</div>"
    + c.v.map(k=>verseBlock(k, mark[k].set, mark[k].cls, mark[k].letters)).join("");
}
function caseBody(c){
  let h = caseVisual(c);

     + '<textarea data-note="'+c.id+'" placeholder="اكتبي الرابط اللي هيثبّتها عندك…">'

     + '<div class="row" style="margin-top:7px"><span class="saved">اتحفظ</span></div></div>';

           : '<span class="muted">جديد — لسه ما اتدرّبتيش عليه</span>')
     + "</div>";

function caseCard(c){

function frameLineText(c){

/* ---------------------------------------------------- surah map + chain */
const MUQ = new Set(["الم","المص","الر","المر","كهيعص","طه","طسم","طس","يس","ص","حم","عسق","ق","ن"]);
function buildOpenings(){
  OPEN = {of:{}, g:{}};
  for(let n=1;n<=114;n++){
    const k = n===1 ? "1:2" : n+":1";
    const t = toks(k), s = t.join(" ");
    let r=null;
    const w0 = D.verses[n+":1"][0][0] || "";
    // a muqatta'at opening, not the word «أَلَمْ» which normalises to the same letters
    const isMuq = MUQ.has(t[0]) && w0[0] !== "أ"
                  && (t.every(x=>MUQ.has(x)) || t[0].length<=2);
    if(isMuq)                           r=["muq:"+t[0], "مفتتحة بـ «"+w0+"»"];
    else if(t[0]==="الم" && w0[0]==="أ") r=["alam","مفتتحة بـ «أَلَمْ»"];

/* a drawn mind map: a trunk down the middle with ribs curving out to each node */
function mindMap(rootLabel, nodes){
  const W=420, NW=184, TRUNK=210, TOP=100;
  let y=TOP, ribs=[], boxes=[], lastCy=TOP;
  nodes.forEach((n,i)=>{
    const lines = 1 + (n.sub?n.sub.length:0);
    const h = Math.max(52, 18+lines*22);
    const right = i%2===0;
    const x = right ? W-12-NW : 12;
    const cy = y + h/2, edge = right ? x : x+NW;
    const col = "var(--m"+(n.cls||"c1").slice(1)+")";
    ribs.push('<path d="M'+TRUNK+','+(cy-34)+' Q'+TRUNK+','+cy+' '+edge+','+cy
      +'" fill="none" stroke="'+col+'" stroke-width="2.5" stroke-linecap="round"/>'
      + '<circle cx="'+edge+'" cy="'+cy+'" r="4.5" fill="'+col+'"/>');
    boxes.push('<foreignObject x="'+x+'" y="'+y+'" width="'+NW+'" height="'+h+'">'
      + '<div xmlns="http://www.w3.org/1999/xhtml" class="mnode '+(n.cls||"c1")+'" '
      + (n.data||"")+'><b>'+esc(n.t)+"</b>"
      + (n.sub||[]).map(s=>"<span>"+esc(s)+"</span>").join("")+"</div></foreignObject>");
    lastCy = cy; y += h+14;
  });
  const H = y+6;
  return '<svg class="mmap" viewBox="0 0 '+W+" "+H+'" width="100%" height="'+H+'" role="img" '
    + 'aria-label="'+esc(rootLabel)+'">'
    + '<path d="M'+TRUNK+',60 L'+TRUNK+","+lastCy+'" stroke="var(--emerald)" stroke-width="3" '
    + 'stroke-linecap="round" fill="none" opacity=".55"/>'
    + ribs.join("")
    + '<foreignObject x="'+((W-230)/2)+'" y="6" width="230" height="52">'
    + '<div xmlns="http://www.w3.org/1999/xhtml" class="mroot">'+esc(rootLabel)+"</div></foreignObject>"
    + boxes.join("") + "</svg>";
}

/* ============================================== الصوت: تسجيلك وصوت الشيخ
   بيتخزّن على الجهاز نفسه (localStorage) عشان يشتغل كمان لو الملف متفتح
   من غير سيرفر ومن غير نت. */
/* ---------- تخزين الصوت ----------
   بنستعمل IndexedDB لأن مساحتها كبيرة (مئات الميجات) وبتخزّن الملف زي ما هو.
   لو مش متاحة (زي لما الملف يتفتح من على الجهاز مباشرة) بنرجع لـ localStorage
   وساعتها المساحة صغيرة. الفهرس متخزّن في localStorage عشان الواجهة تعرف
   فورًا مين متخزّن من غير انتظار. */
const AUD_LS  = "mutashabihat.audio";
const AUD_IDX = "mutashabihat.audioidx";
const AUD_MAX = 760000;        /* حد المقطع الواحد في التخزين الاحتياطي بس */
let IDB = null, IDBTRIED = false;
const URLC = {};               /* روابط جاهزة عشان الدوسة تشتغل على طول */

function idxAll(){
  try{ return JSON.parse(localStorage.getItem(AUD_IDX) || "{}"); }catch(e){ return {}; }
}
function idxSet(key, where){
  const o = idxAll();
  if(where) o[key] = where; else delete o[key];
  try{ localStorage.setItem(AUD_IDX, JSON.stringify(o)); }catch(e){}
}
function audAll(){
  try{ return JSON.parse(localStorage.getItem(AUD_LS) || "{}"); }catch(e){ return {}; }
}
function audHas(kind, k){ const key = kind+":"+k; return !!(idxAll()[key] || audAll()[key]); }
const audCount = () => Object.keys(idxAll()).length;
/* كل المفاتيح المتخزّنة، سواء في IndexedDB أو في التخزين الاحتياطي */
function audKeys(kind){
  const all = new Set(Object.keys(idxAll()).concat(Object.keys(audAll())));
  const pre = kind+":";
  return [...all].filter(x=>x.indexOf(pre)===0).map(x=>x.slice(pre.length))
                 .filter(x=>D.verses[x]).sort(cmpKey);
}

function idb(){
  if(IDBTRIED) return IDB;
  IDBTRIED = true;
  try{
    if(!window.indexedDB){ IDB = null; return IDB; }
    const req = indexedDB.open("mushaf-audio", 1);
    req.onupgradeneeded = () => { try{ req.result.createObjectStore("clips"); }catch(e){} };
    IDB = new Promise(res=>{
      req.onsuccess = () => res(req.result);
      req.onerror   = () => res(null);
      req.onblocked = () => res(null);
      setTimeout(()=>res(null), 4000);
    });
  }catch(e){ IDB = null; }
  return IDB;
}
async function idbPut(key, blob){
  const db = await idb(); if(!db) return false;
  return new Promise(res=>{
    try{
      const tx = db.transaction("clips", "readwrite");
      tx.objectStore("clips").put(blob, key);
      tx.oncomplete = () => res(true);
      tx.onerror = () => res(false);
      tx.onabort = () => res(false);
    }catch(e){ res(false); }
  });
}
async function idbGet(key){
  const db = await idb(); if(!db) return null;
  return new Promise(res=>{
    try{
      const q = db.transaction("clips", "readonly").objectStore("clips").get(key);
      q.onsuccess = () => res(q.result || null);
      q.onerror = () => res(null);
    }catch(e){ res(null); }
  });
}
async function idbDel(key){
  const db = await idb(); if(!db) return;
  try{ db.transaction("clips", "readwrite").objectStore("clips").delete(key); }catch(e){}
}
async function audWarm(key){
  if(URLC[key]) return URLC[key];
  if(idxAll()[key] === "idb"){
    const b = await idbGet(key);
    if(b){ try{ URLC[key] = URL.createObjectURL(b); }catch(e){} }
  }else{
    const d = audAll()[key];
    if(d) URLC[key] = d;
  }
  return URLC[key] || null;
}
async function audWarmAll(){
  const ls = audAll();
  for(const k in ls) URLC[k] = ls[k];
  for(const k of Object.keys(idxAll())) await audWarm(k);
}
const audSrc = (kind, k) => URLC[kind+":"+k] || null;

async function audPutBlob(kind, k, blob){
  const key = kind+":"+k;
  if(await idbPut(key, blob)){
    idxSet(key, "idb");
    try{ URLC[key] = URL.createObjectURL(blob); }catch(e){}
    return "";
  }
  const d = await new Promise(res=>{
    const f = new FileReader();
    f.onload = ()=>res(String(f.result));
    f.onerror = ()=>res("");
    f.readAsDataURL(blob);
  });
  if(!d) return "ما قدرتش أقرا المقطع.";
  if(d.length > AUD_MAX)
    return "الصوت ده كبير على المساحة المتاحة هنا — هيشتغل من النت عادي بس مش هيتخزّن.";
  const o = audAll(); o[key] = d;
  try{ localStorage.setItem(AUD_LS, JSON.stringify(o)); }
  catch(e){ return "المساحة خلصت — امسحي شوية تسجيلات، أو افتحي التطبيق في كروم "
                 + "عشان المساحة تبقى أكبر بكتير."; }
  idxSet(key, "ls"); URLC[key] = d;
  return "";
}
function audDel(kind, k){
  const key = kind+":"+k;
  idbDel(key);
  const o = audAll(); delete o[key];
  try{ localStorage.setItem(AUD_LS, JSON.stringify(o)); }catch(e){}
  const u = URLC[key];
  if(u){ try{ if(u.indexOf("blob:")===0) URL.revokeObjectURL(u); }catch(e){} delete URLC[key]; }
  idxSet(key, null);
}
let AUDEL = null;
/* بنستعمل نفس العنصر طول الوقت: بعض المتصفحات بترفض عنصر صوت جديد */
function player(){
  if(!AUDEL) AUDEL = $("#player") || new Audio();
  return AUDEL;
}
function playSrc(src, okMsg, badHint){
  const p = player();
  try{ p.pause(); }catch(e){}
  p.src = src;
  p.load();
  const done = p.play();
  if(done && done.catch) done.catch(err=>{
    const nm = (err && err.name) || "";
    toast((badHint || "المتصفح رفض يشغّل الصوت.")+(nm ? "  ["+nm+"]" : ""), true);
  });
  else if(okMsg) toast(okMsg);
}
function audPlay(kind, k){
  const src = audSrc(kind, k);
  if(!src){
    audWarm(kind+":"+k).then(u=>{ if(u) playSrc(u, "", "مش قادر يشغّل المقطع."); });
    return;
  }
  playSrc(src, "", "مش قادر يشغّل المقطع المحفوظ.");
}
let toastT = 0;
function toast(m, bad){
  const e = $("#toast"); if(!e) return;
  e.textContent = m; e.classList.toggle("bad", !!bad); e.hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(()=>{ e.hidden = true; }, bad ? 7000 : 2600);
}
function audMsg(txt, bad){
  toast(txt, bad);
  const e = $("#audMsg"); if(!e) return;
  e.textContent = txt; e.classList.toggle("bad", !!bad);
}
let REC = null;
async function recToggle(k){
  if(REC && REC.k === k){ REC.mr.stop(); return; }
  if(!navigator.mediaDevices || !window.MediaRecorder){
    audMsg("المتصفح ده مش بيدعم التسجيل.", true); return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const mr = new MediaRecorder(stream);
    const chunks = [];
    mr.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = () => {
      stream.getTracks().forEach(t=>t.stop());
      const blob = new Blob(chunks, {type: mr.mimeType || "audio/webm"});
      REC = null;
      if(!blob.size){ audRefresh(); audMsg("ما اتسجّلش صوت — جرّبي تاني وقربي من الميك.", true); return; }
      audPutBlob("me", k, blob).then(err=>{
        audRefresh();
        audMsg(err || "اتسجّل ✓ ("+Math.round(blob.size/1024)+" كيلو) — اسمعيه وكرري وراه.", !!err);
      });
    };
    mr.start();
    REC = {mr, k};
    audRefresh();
    audMsg("بسجّل… اقري الآية وبعدين دوسي «وقّفي».");
  }catch(e){
    REC = null;
    const nm = (e && e.name) || "";
    let m;
    if(nm === "NotFoundError" || nm === "DevicesNotFoundError")
      m = "مفيش ميكروفون متوصّل بالجهاز.";
    else if(location.protocol === "file:")
      m = "التسجيل مش بيشتغل والملف متفتح من على جهازك على طول. "

function learnSteps(){
  const n = L.keys.length;
  return n*3 + Math.max(0, n-1) + 1;   /* ٣ مراحل لكل آية + وصل + تسميع أخير */

function learnAt(){
  if(L.fin) return learnSteps()-1;
  let c = 0;
  for(let x=0; x<L.i; x++) c += 3 + (x>0 ? 1 : 0);
  return c + Math.min(L.stage, 3);
}

        + (L.shown ? "اخفيها" : "وريني الآية")+"</button>");

function learnStep(){
  L.reps++;
  const need = L_REPS[L.stage];
  if(L.reps < need){ showLearn(); return; }
  L.reps = 0; L.shown = false;
  const last = L.i === L.keys.length-1;
  if(L.stage < 2) L.stage++;
  else if(L.stage === 2 && L.i > 0) L.stage = 3;
  else if(last){ L.fin = true; }
  else { L.i++; L.stage = 0; }
  showLearn();
}

function finishLearn(){
  const p = S.plan, ks = L.keys;
  if(p){
    const i = ALLK.indexOf(ks[ks.length-1]);
    p.cur = ALLK[i+1] || ks[ks.length-1];
    p.day = localDay();
    p.total = (p.total||0) + ks.length;
  }
  /* نعلّم السورة في التشيك ليست، ونضيف المحفوظ لنطاق المراجعة */
  const sur = [...new Set(ks.map(k=>+k.split(":")[0]))];
  sur.forEach(n=>{ if(chkS(n) === 0) chk().s[n] = 1; });
  if(p){
    const nx = p.cur.split(":");
    sur.forEach(n=>{ if(+nx[0] > n && chkS(n) === 1) chk().s[n] = 2; });
  }
  const m = S.memo || {all:true};
  if(!m.all){
    const ranges = (m.ranges||[]).map(r=>({s:r.s,a:r.a,b:r.b}));
    ks.forEach(k=>{
      const sn = +k.split(":")[0], a = +k.split(":")[1];
      const hit = ranges.find(r=>r.s===sn && a>=r.a-1 && a<=r.b+1);
      if(hit){ hit.a = Math.min(hit.a, a); hit.b = Math.max(hit.b, a); }
      else ranges.push({s:sn, a:a, b:a});
    });
    S.memo = {all:false, juz:m.juz||[], sur:m.sur||[], ranges};
  }
  save();
  $("#learnBar").style.width = "100%";
  $("#learnCount").textContent = "";
  $("#learnBody").innerHTML = '<div class="ldone"><div class="big">تمام، خلّصتِ ورد النهاردة</div>'
    + '<div class="muted" style="line-height:1.9">حفظتِ '+ayahWord(ks.length)+": "
    + esc(ks.length===1 ? refAr(ks[0]) : rangeLabel(ks[0], ks[ks.length-1]))+".<br>"
    + "بكرة هيجيلك الورد اللي بعده لوحده، ودي هتدخل مراجعتك اليومية.</div></div>";
  $("#learnFoot").innerHTML = '<button class="btn block" type="button" data-close="learn">تمام</button>';
  L = null;
}

/* ---- مقاطع السورة: مبنية على أوائل الآيات المتكررة وفواصلها ---- */
const lastN = k => { const t=toks(k); return t[t.length-1]; };
const lastW = k => { const w=D.verses[k][0]; return w[w.length-1]; };
function segments(n){
  const key = a => { const t=toks(n+":"+a)[0]||""; return t.slice(0,3); };
  const runs=[];
  for(let a=1;a<=SC[n];a++){
    const f=key(a), g=runs[runs.length-1];
    if(g && g.f===f) g.to=a; else runs.push({f, from:a, to:a});
  }
  const out=[];
  for(const r of runs){
    const len=r.to-r.from+1, prev=out[out.length-1];
    if(len>=3) out.push({from:r.from,to:r.to,f:r.f});
    else if(prev && !prev.f) prev.to=r.to;
    else out.push({from:r.from,to:r.to,f:null});
  }
  while(out.length>10){
    let bi=0,best=Infinity;
    for(let i=0;i<out.length-1;i++){
      const sz=(out[i].to-out[i].from+1)+(out[i+1].to-out[i+1].from+1);
      if(sz<best){best=sz;bi=i;}
    }
    out[bi].to=out[bi+1].to; out[bi].f=null; out.splice(bi+1,1);
  }
  return out;
}
function fasila(n, from, to){
  const c={};
  for(let a=from;a<=to;a++){ const w=lastN(n+":"+a); c[w]=(c[w]||0)+1; }
  let best=null,bn=0;
  for(const w in c) if(c[w]>bn){bn=c[w];best=w;}
  if(bn<2) return null;
  for(let a=from;a<=to;a++) if(lastN(n+":"+a)===best) return {w:lastW(n+":"+a), n:bn};
  return null;
}
function endCounts(n){
  const c={};
  for(let a=1;a<=SC[n];a++){ const w=lastN(n+":"+a); c[w]=(c[w]||0)+1; }

}

      const b = await r.blob();

      if(err){ onMsg(err, true); return; }
      ok++;
    }catch(e){ fail++; }
    onMsg("بنزّل… "+ar(ok)+" من "+ar(keys.length), false);
  }
  onMsg(fail ? ayahWord(ok)+" اتنزّلت و"+ar(fail)+" ما نفعتش — جرّبي تاني."
             : "تمام، "+ayahWord(ok)+" بقت متاحة من غير نت ✓", !!fail);
}

let Q=null;
function buildQueue(list, max){
  const due = list.filter(c=>{const s=card(c.id); return s&&s.d<=Date.now();});
  const nw  = list.filter(c=>!card(c.id));
  const rest= list.filter(c=>card(c.id) && card(c.id).d>Date.now());
  const q = [...shuffle(due), ...shuffle(nw).slice(0,10)];
  if(q.length<5) q.push(...shuffle(rest).slice(0, 10-q.length));
  return q.slice(0, max||15);
}
function startDrill(list, title, daily){
  const q = daily ? shuffle(list.slice()) : buildQueue(list);
  if(!q.length) return;
  Q = {q, i:0, right:0, wrong:0, answered:false, daily:!!daily, again:0};
  $("#drillTitle").textContent = title || "تدريب";
  $("#drill").hidden=false;
  showQ();
}
function pickMode(c){
  if(c.t==="ayah")
    return D.verses[c.v[0]][0].length>=5 && Math.random()<0.5 ? "fill" : "nextayah";
  if(c.t==="identical") return "count";
  if(c.t==="similar")   return "spot";
  const r = Math.random();
  return r<0.34 ? "blankfree" : r<0.67 ? "where" : "blank";
}

  return '<div class="selfrate"><div class="q-ask" style="margin-bottom:8px">قيّمي نفسك بصراحة — '

        '<button class="opt rate r-'+v+'" type="button" data-rate="'+v+'">'+l+"</button>").join("")
    + "</div></div>";
}
function revealAnswer(){
  const c=Q.q[Q.i]; let ans="";
  if(Q.mode==="fill"){
    ans = '<div class="verse"><div class="ayah">'+ayahHTML(c.v[0])+"</div></div>";
  } else if(Q.mode==="nextayah"){
    const k=c.v[0], n=+k.split(":")[0], a=+k.split(":")[1];
    if(a<SC[n]) ans = verseBlock(n+":"+(a+1));
    else if(n<114) ans = '<div class="muted" style="margin-bottom:8px">دي آخر آية في '
        + esc(SU[n])+"، واللي بعدها أول آية في <b>"+esc(SU[n+1])+"</b>:</div>"
        + verseBlock((n+1)+":1");
    else ans = '<div class="muted">دي آخر آية في المصحف كله — مفيش بعدها.</div>';
  } else {
    ans = caseVisual(c);

  $("#fb").innerHTML = ans + selfRateHTML();
  const rb=$("#reveal"); if(rb) rb.hidden=true;

function finishSelf(rating, c){
  Q.answered=true;
  gradeSelf(c, rating, Q.daily);
  Q.self = Q.self || {easy:0,hmm:0,hard:0};
  Q.self[rating]++;
  S.day.n++; save();
  if(rating==="hard" && Q.again<12){
    Q.again++; Q.q.splice(Math.min(Q.q.length, Q.i+3), 0, c);
  }
  $$(".opt.rate").forEach(b=>{ b.disabled=true;
    if(b.dataset.rate!==rating) b.style.opacity=".4"; else b.classList.add("picked"); });
  const st=card(c.id);
  if(st) $("#fb").insertAdjacentHTML("beforeend",
    '<div class="muted" style="margin-top:11px"><b>'+STATE_AR(st.b)+"</b> · "+nextDue(st)+"</div>");
  $("#drillNext").textContent = Q.i+1 >= Q.q.length ? "إنهاء" : "التالي";
}

  const c = Q.q[Q.i];
